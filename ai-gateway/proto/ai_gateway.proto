syntax = "proto3";

package agriculture.ai.v1;

option go_package = "p9e.in/samavaya/agriculture/ai-gateway/api/v1;aipb";

// AIGatewayService is the central gateway that wraps all Rust AI/ML engines
// and exposes them over gRPC to Go microservices.
service AIGatewayService {
  // ─── Plant Diagnosis ───────────────────────────────────────────────
  // Diagnose plant diseases from leaf/stem/fruit images.
  rpc DiagnoseImage(DiagnoseImageRequest) returns (DiagnoseImageResponse);

  // Detect pest damage from plant images.
  rpc DetectPests(DetectPestsRequest) returns (DetectPestsResponse);

  // Detect nutrient deficiency from visual symptoms in plant images.
  rpc DetectNutrientDeficiency(DetectNutrientDeficiencyRequest) returns (DetectNutrientDeficiencyResponse);

  // Classify a plant species from images.
  rpc ClassifyPlant(ClassifyPlantRequest) returns (ClassifyPlantResponse);

  // ─── Yield Prediction ──────────────────────────────────────────────
  // Predict crop yield from environmental, soil, and management factors.
  rpc PredictYield(PredictYieldRequest) returns (PredictYieldResponse);

  // Simulate crop growth over time given initial conditions.
  rpc SimulateCropGrowth(SimulateCropGrowthRequest) returns (SimulateCropGrowthResponse);

  // ─── Satellite / Vegetation ────────────────────────────────────────
  // Compute NDVI and related vegetation indices from raster bands.
  rpc ComputeNDVI(ComputeNDVIRequest) returns (ComputeNDVIResponse);

  // Detect vegetation stress from satellite imagery.
  rpc DetectVegetationStress(DetectVegetationStressRequest) returns (DetectVegetationStressResponse);

  // ─── Recommendations ──────────────────────────────────────────────
  // Recommend suitable crops based on soil, climate, and economics.
  rpc RecommendCrops(RecommendCropsRequest) returns (RecommendCropsResponse);

  // ─── Alerting ─────────────────────────────────────────────────────
  // Evaluate field conditions and return risk scores with alerts.
  rpc EvaluateFieldRisk(EvaluateFieldRiskRequest) returns (EvaluateFieldRiskResponse);

  // ─── Analytics ────────────────────────────────────────────────────
  // Compute field-level historical analytics with trend analysis.
  rpc ComputeFieldAnalytics(ComputeFieldAnalyticsRequest) returns (ComputeFieldAnalyticsResponse);

  // ─── Prescriptions ────────────────────────────────────────────────
  // Generate variable-rate prescription maps for a field.
  rpc GeneratePrescription(GeneratePrescriptionRequest) returns (GeneratePrescriptionResponse);

  // ─── Terrain Analysis ───────────────────────────────────────────
  rpc AnalyzeTerrain(AnalyzeTerrainRequest) returns (AnalyzeTerrainResponse);

  // ─── Water Flow Simulation ──────────────────────────────────────
  rpc SimulateWaterFlow(SimulateWaterFlowRequest) returns (SimulateWaterFlowResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Plant Diagnosis Messages
// ─────────────────────────────────────────────────────────────────────────────

message DiagnoseImageRequest {
  string request_id = 1;
  repeated ImageData images = 2;
  string plant_species_id = 3; // optional hint
  repeated string operations = 4; // preprocessing ops: resize, normalize, enhance
}

message DiagnoseImageResponse {
  string request_id = 1;
  repeated DiseaseDetection diseases = 2;
  double overall_health_score = 3;
  string summary = 4;
  string model_version = 5;
  int64 processing_time_ms = 6;
}

message DiseaseDetection {
  string disease_id = 1;
  string disease_name = 2;
  string scientific_name = 3;
  double confidence_score = 4;
  string severity = 5; // MILD, MODERATE, SEVERE, CRITICAL
  string description = 6;
  string symptoms = 7;
  repeated string treatment_options = 8;
  string prevention = 9;
}

message DetectPestsRequest {
  string request_id = 1;
  repeated ImageData images = 2;
  string plant_species_id = 3;
}

message DetectPestsResponse {
  string request_id = 1;
  repeated PestDetection pests = 2;
  string model_version = 3;
  int64 processing_time_ms = 4;
}

message PestDetection {
  string pest_id = 1;
  string pest_name = 2;
  string scientific_name = 3;
  double confidence_score = 4;
  string damage_level = 5; // MILD, MODERATE, SEVERE, CRITICAL
  string description = 6;
  string damage_pattern = 7;
  repeated string control_methods = 8;
}

message DetectNutrientDeficiencyRequest {
  string request_id = 1;
  repeated ImageData images = 2;
  string plant_species_id = 3;
}

message DetectNutrientDeficiencyResponse {
  string request_id = 1;
  repeated NutrientDeficiency deficiencies = 2;
  string model_version = 3;
  int64 processing_time_ms = 4;
}

message NutrientDeficiency {
  string nutrient = 1;
  double confidence_score = 2;
  string severity = 3;
  string description = 4;
  string visual_symptoms = 5;
  repeated string recommended_fertilizers = 6;
  string application_method = 7;
}

message ClassifyPlantRequest {
  string request_id = 1;
  repeated ImageData images = 2;
}

message ClassifyPlantResponse {
  string request_id = 1;
  PlantClassification species = 2;
  string model_version = 3;
  int64 processing_time_ms = 4;
}

message PlantClassification {
  string species_id = 1;
  string common_name = 2;
  string scientific_name = 3;
  string family = 4;
  double confidence = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Yield Prediction Messages
// ─────────────────────────────────────────────────────────────────────────────

message PredictYieldRequest {
  string request_id = 1;
  string crop_type = 2;
  EnvironmentFactors environment = 3;
  SoilFactors soil = 4;
  ManagementFactors management = 5;
  double field_area_hectares = 6;
}

message PredictYieldResponse {
  string request_id = 1;
  double predicted_yield_kg_per_hectare = 2;
  double confidence_pct = 3;
  double yield_lower_bound = 4;
  double yield_upper_bound = 5;
  repeated StressFactor stress_factors = 6;
  string model_version = 7;
  int64 processing_time_ms = 8;
}

message EnvironmentFactors {
  double temperature_celsius = 1;
  double humidity_pct = 2;
  double rainfall_mm = 3;
  double solar_radiation = 4;
  double wind_speed_kmh = 5;
  double growing_degree_days = 6;
}

message SoilFactors {
  double ph = 1;
  double organic_matter_pct = 2;
  double nitrogen_ppm = 3;
  double phosphorus_ppm = 4;
  double potassium_ppm = 5;
  double moisture_pct = 6;
  string texture = 7;
  double compaction_index = 8;
}

message ManagementFactors {
  double irrigation_efficiency = 1;
  double fertilizer_rate_kg_per_ha = 2;
  string tillage_type = 3;
  double planting_density = 4;
  string pest_management_level = 5;
}

message StressFactor {
  string factor_name = 1;
  double severity = 2; // 0.0 to 1.0
  double yield_impact_pct = 3;
}

message SimulateCropGrowthRequest {
  string request_id = 1;
  string crop_type = 2;
  int32 simulation_days = 3;
  EnvironmentFactors initial_environment = 4;
  SoilFactors initial_soil = 5;
  double planting_density = 6;
}

message SimulateCropGrowthResponse {
  string request_id = 1;
  repeated GrowthStageResult stages = 2;
  double final_biomass_kg_per_ha = 3;
  int32 estimated_days_to_maturity = 4;
  string model_version = 5;
  int64 processing_time_ms = 6;
}

message GrowthStageResult {
  int32 day = 1;
  string stage_name = 2;
  double biomass_kg_per_ha = 3;
  double leaf_area_index = 4;
  double canopy_height_cm = 5;
  double water_demand_mm = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Satellite / Vegetation Messages
// ─────────────────────────────────────────────────────────────────────────────

message ComputeNDVIRequest {
  string request_id = 1;
  string raster_url = 2; // URL to the GeoTIFF or raster source
  RasterBands bands = 3; // or supply raw band data inline
  BoundingBox clip_bounds = 4; // optional clip to field boundary
}

message RasterBands {
  repeated double nir_band = 1; // NIR values (row-major flat array)
  repeated double red_band = 2; // RED values
  repeated double green_band = 3;
  repeated double blue_band = 4;
  repeated double red_edge_band = 5;
  int32 width = 6;
  int32 height = 7;
}

message BoundingBox {
  double min_lon = 1;
  double min_lat = 2;
  double max_lon = 3;
  double max_lat = 4;
}

message ComputeNDVIResponse {
  string request_id = 1;
  repeated double ndvi_values = 2; // row-major NDVI grid
  int32 width = 3;
  int32 height = 4;
  BandStatistics statistics = 5;
  repeated NdviZone zones = 6;
  string model_version = 7;
  int64 processing_time_ms = 8;
}

message BandStatistics {
  double min = 1;
  double max = 2;
  double mean = 3;
  double std_dev = 4;
  double median = 5;
  int64 valid_pixel_count = 6;
}

message NdviZone {
  string classification = 1; // e.g. "bare_soil", "sparse", "moderate", "dense", "very_dense"
  double min_value = 2;
  double max_value = 3;
  int64 pixel_count = 4;
  double area_pct = 5;
}

message DetectVegetationStressRequest {
  string request_id = 1;
  string raster_url = 2;
  RasterBands bands = 3;
  BoundingBox clip_bounds = 4;
  double ndvi_stress_threshold = 5; // default 0.3
  double ndwi_stress_threshold = 6; // default -0.1
}

message DetectVegetationStressResponse {
  string request_id = 1;
  repeated StressZone stress_zones = 2;
  double overall_stress_pct = 3;
  double healthy_pct = 4;
  BandStatistics ndvi_statistics = 5;
  string model_version = 6;
  int64 processing_time_ms = 7;
}

message StressZone {
  string stress_type = 1; // WATER, NUTRIENT, DISEASE, HEAT
  string severity = 2;
  double affected_area_pct = 3;
  double confidence = 4;
  BoundingBox bounds = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// Recommendation Messages
// ─────────────────────────────────────────────────────────────────────────────

message RecommendCropsRequest {
  string request_id = 1;
  SoilConditions soil = 2;
  ClimateConditions climate = 3;
  EconomicFactors economics = 4;
  int32 max_recommendations = 5; // default 5
}

message SoilConditions {
  double ph = 1;
  double organic_matter_pct = 2;
  double nitrogen_ppm = 3;
  double phosphorus_ppm = 4;
  double potassium_ppm = 5;
  string texture = 6; // clay, loam, sandy, silt
  string drainage_class = 7; // poor, moderate, well, excessive
}

message ClimateConditions {
  double avg_temperature_celsius = 1;
  double annual_rainfall_mm = 2;
  double avg_humidity_pct = 3;
  double frost_free_days = 4;
  double solar_radiation_kwh = 5;
  string climate_zone = 6;
}

message EconomicFactors {
  double market_price_per_kg = 1;
  double input_cost_per_hectare = 2;
  double labor_cost_per_hectare = 3;
  double water_cost_per_cubic_meter = 4;
  bool organic_premium = 5;
}

message RecommendCropsResponse {
  string request_id = 1;
  repeated CropRecommendation recommendations = 2;
  string model_version = 3;
  int64 processing_time_ms = 4;
}

message CropRecommendation {
  string crop_name = 1;
  string scientific_name = 2;
  string category = 3;
  double suitability_score = 4;
  double confidence = 5;
  double expected_yield_kg_per_ha = 6;
  double expected_profit_per_ha = 7;
  double water_requirement_mm = 8;
  string rationale = 9;
  repeated string risk_factors = 10;
}

// ─────────────────────────────────────────────────────────────────────────────
// Common Messages
// ─────────────────────────────────────────────────────────────────────────────

message ImageData {
  string image_url = 1; // URL to fetch the image
  bytes image_bytes = 2; // or inline bytes
  string image_type = 3; // LEAF, STEM, FRUIT, WHOLE_PLANT, ROOT
  string mime_type = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Alerting Messages
// ─────────────────────────────────────────────────────────────────────────────

message EvaluateFieldRiskRequest {
  string request_id = 1;
  string field_id = 2;
  string farm_id = 3;
  string crop_type = 4;
  FieldWeather weather = 5;
  FieldSoilState soil_state = 6;
  DetectionResults detections = 7;
  GrowthState growth = 8;
}

message FieldWeather {
  double temperature_current = 1;
  double temperature_min_forecast = 2;
  double temperature_max_forecast = 3;
  double precipitation_mm = 4;
  double precipitation_forecast_mm = 5;
  double et_reference_mm = 6;
  double co2_ppm = 7;
}

message FieldSoilState {
  double soil_moisture = 1;
}

message DetectionResults {
  double pest_confidence = 1;
  string pest_species = 2;
  double disease_confidence = 3;
  string disease_name = 4;
  double nutrient_severity = 5;
  string nutrient_type = 6;
}

message GrowthState {
  double ndvi_current = 1;
  double ndvi_previous = 2;
  double growth_expected = 3;
  double growth_actual = 4;
}

message EvaluateFieldRiskResponse {
  string request_id = 1;
  string field_id = 2;
  double overall_risk = 3;
  double temperature_risk = 4;
  double water_risk = 5;
  double pest_risk = 6;
  double disease_risk = 7;
  double nutrient_risk = 8;
  double growth_risk = 9;
  repeated FieldAlert alerts = 10;
  int64 processing_time_ms = 11;
}

message FieldAlert {
  string alert_type = 1;
  string severity = 2;
  string title = 3;
  string message = 4;
  repeated string recommendations = 5;
  double metric_value = 6;
  double threshold_value = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Analytics Messages
// ─────────────────────────────────────────────────────────────────────────────

message ComputeFieldAnalyticsRequest {
  string request_id = 1;
  string field_id = 2;
  string farm_id = 3;
  repeated SeasonRecord seasons = 4;
  repeated NdviDataPoint ndvi_series = 5;
}

message SeasonRecord {
  string crop_type = 1;
  string season = 2;
  int32 year = 3;
  double yield_kg_per_ha = 4;
  uint32 stress_days = 5;
  uint32 frost_events = 6;
  uint32 heat_events = 7;
  uint32 drought_days = 8;
  double total_precipitation_mm = 9;
  double mean_temperature = 10;
  double mean_ndvi = 11;
  double peak_ndvi = 12;
  double total_thermal_time = 13;
}

message NdviDataPoint {
  string date = 1;
  double mean_ndvi = 2;
  double min_ndvi = 3;
  double max_ndvi = 4;
  double std_dev = 5;
}

message ComputeFieldAnalyticsResponse {
  string request_id = 1;
  string field_id = 2;
  int32 season_count = 3;
  string yield_trend = 4;
  double yield_trend_pct_per_year = 5;
  double mean_yield = 6;
  double best_yield = 7;
  double worst_yield = 8;
  double yield_variability_cv = 9;
  string ndvi_trend = 10;
  double ndvi_trend_per_year = 11;
  double mean_stress_days_per_season = 12;
  RotationAnalysis rotation = 13;
  repeated SeasonComparisonResult season_comparisons = 14;
  int64 processing_time_ms = 15;
}

message RotationAnalysis {
  repeated string rotation_pattern = 1;
  double effectiveness_score = 2;
  double yield_impact_pct = 3;
  double stress_reduction_pct = 4;
  string recommendation = 5;
}

message SeasonComparisonResult {
  string season = 1;
  int32 year = 2;
  string crop_type = 3;
  double yield_vs_mean_pct = 4;
  double stress_vs_mean_pct = 5;
  double ndvi_vs_mean_pct = 6;
  repeated string notable_events = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Prescription Messages
// ─────────────────────────────────────────────────────────────────────────────

message GeneratePrescriptionRequest {
  string request_id = 1;
  string field_id = 2;
  PrescriptionGrid grid = 3;
  PrescriptionZoneInput zone_input = 4;
  PrescriptionCropRequirements crop_requirements = 5;
  repeated string prescription_types = 6; // FERTILIZER, IRRIGATION, SEEDING, LIMING
}

message PrescriptionGrid {
  int32 rows = 1;
  int32 cols = 2;
  double cell_size_m = 3;
  double origin_lat = 4;
  double origin_lon = 5;
}

message PrescriptionZoneInput {
  repeated double ndvi = 1;
  repeated double soil_nitrogen = 2;
  repeated double soil_phosphorus = 3;
  repeated double soil_potassium = 4;
  repeated double soil_ph = 5;
  repeated double soil_moisture = 6;
  repeated double soil_organic_matter = 7;
}

message PrescriptionCropRequirements {
  string crop_type = 1;
  double target_yield_kg_ha = 2;
  double nitrogen_kg_ha = 3;
  double phosphorus_kg_ha = 4;
  double potassium_kg_ha = 5;
  double optimal_ph_low = 6;
  double optimal_ph_high = 7;
  double water_requirement_mm = 8;
  double seed_rate_per_ha = 9;
}

message GeneratePrescriptionResponse {
  string request_id = 1;
  string field_id = 2;
  repeated PrescriptionMapResult prescriptions = 3;
  double estimated_cost_savings_pct = 4;
  double estimated_yield_gain_pct = 5;
  int64 processing_time_ms = 6;
}

message PrescriptionMapResult {
  string prescription_type = 1;
  repeated double rates = 2;
  string unit = 3;
  double total_amount = 4;
  repeated PrescriptionZoneSummary zone_summaries = 5;
}

message PrescriptionZoneSummary {
  string zone = 1;
  int32 cell_count = 2;
  double area_ha = 3;
  double mean_rate = 4;
  double min_rate = 5;
  double max_rate = 6;
  double total_amount = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Terrain Analysis Messages
// ─────────────────────────────────────────────────────────────────────────────

message AnalyzeTerrainRequest {
  string request_id = 1;
  // DEM elevation data as a flat row-major array.
  repeated double elevation = 2;
  int32 width = 3;
  int32 height = 4;
  // Cell size in meters (square cells).
  double cell_size = 5;
  // Nodata value (default -9999).
  double nodata_value = 6;
  // Which analyses to run: SLOPE, ASPECT, CONTOUR, FLOW_DIRECTION,
  // FLOW_ACCUMULATION, WATERSHED, HILLSHADE, TRI, TPI, FULL.
  repeated string analyses = 7;
  // Contour interval in meters (used when CONTOUR or FULL is requested).
  double contour_interval = 8;
  // Stream threshold for flow accumulation (used when FLOW_ACCUMULATION or FULL).
  double stream_threshold = 9;
  // Hillshade parameters (defaults: azimuth 315, altitude 45, z_factor 1).
  double hillshade_azimuth = 10;
  double hillshade_altitude = 11;
  double hillshade_z_factor = 12;
}

message AnalyzeTerrainResponse {
  string request_id = 1;
  int32 width = 2;
  int32 height = 3;
  // Slope in degrees (row-major flat array).
  repeated double slope = 4;
  // Aspect in degrees clockwise from north.
  repeated double aspect = 5;
  // Hillshade values (0-255).
  repeated double hillshade = 6;
  // Terrain Ruggedness Index.
  repeated double tri = 7;
  // Topographic Position Index.
  repeated double tpi = 8;
  // D8 flow direction (encoded as u8, cast to int32).
  repeated int32 flow_direction = 9;
  // Flow accumulation values.
  repeated double flow_accumulation = 10;
  // Watershed IDs per cell.
  repeated uint32 watershed_ids = 11;
  // Contour lines.
  repeated TerrainContourLine contour_lines = 12;
  // DEM statistics.
  TerrainDemStatistics dem_statistics = 13;
  // Flow accumulation statistics.
  TerrainFlowStats flow_statistics = 14;
  // Per-watershed statistics.
  repeated TerrainWatershedInfo watershed_statistics = 15;
  int64 processing_time_ms = 16;
}

message TerrainContourLine {
  double elevation = 1;
  // Interleaved x,y coordinates: [x0, y0, x1, y1, ...].
  repeated double coordinates = 2;
}

message TerrainDemStatistics {
  double min_elevation = 1;
  double max_elevation = 2;
  double mean_elevation = 3;
  double elevation_range = 4;
  int64 valid_cells = 5;
  int64 total_cells = 6;
}

message TerrainFlowStats {
  double max_accumulation = 1;
  double mean_accumulation = 2;
  int64 stream_cell_count = 3;
  int64 total_cells = 4;
  double drainage_density = 5;
}

message TerrainWatershedInfo {
  uint32 id = 1;
  int64 cell_count = 2;
  double area_sq_m = 3;
  double mean_elevation = 4;
  double min_elevation = 5;
  double max_elevation = 6;
  double relief = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Water Flow Simulation Messages
// ─────────────────────────────────────────────────────────────────────────────

message SimulateWaterFlowRequest {
  string request_id = 1;
  // Soil moisture parameters.
  WaterFlowMoistureParams moisture_params = 2;
  // Water balance parameters.
  WaterFlowBalanceParams balance_params = 3;
  // Simulation inputs.
  double rainfall_mm_day = 4;
  double et_mm_day = 5;
  double irrigation_mm_day = 6;
  double simulation_days = 7;
  // Daily rainfall series (used for water balance computation; overrides
  // rainfall_mm_day when non-empty).
  repeated double daily_rainfall_mm = 8;
}

message WaterFlowMoistureParams {
  int32 num_layers = 1;
  double layer_thickness_m = 2;
  double k_sat_m_day = 3;
  double field_capacity = 4;
  double wilting_point = 5;
  double saturation = 6;
  double root_zone_depth_m = 7;
}

message WaterFlowBalanceParams {
  double field_area_ha = 1;
  double crop_coefficient = 2;
  double reference_et_mm_day = 3;
  double root_zone_depth_m = 4;
  double field_capacity = 5;
  double wilting_point = 6;
  double management_allowed_depletion = 7;
}

message SimulateWaterFlowResponse {
  string request_id = 1;
  // Soil moisture profiles over time.
  repeated SoilMoistureSnapshot moisture_profiles = 2;
  // Daily water balance results.
  repeated WaterBalanceDay water_balance = 3;
  // Irrigation schedule summary.
  WaterFlowIrrigationSummary irrigation_summary = 4;
  int64 processing_time_ms = 5;
}

message SoilMoistureSnapshot {
  double time_days = 1;
  repeated double layer_moisture = 2;
  double root_zone_water_mm = 3;
  double available_water_mm = 4;
  double drainage_mm_day = 5;
}

message WaterBalanceDay {
  int32 day = 1;
  double etc_mm_day = 2;
  double depletion_mm = 3;
  double total_available_water_mm = 4;
  double readily_available_water_mm = 5;
  bool irrigation_needed = 6;
  double irrigation_amount_mm = 7;
  double effective_rainfall_mm = 8;
  double deep_percolation_mm = 9;
}

message WaterFlowIrrigationSummary {
  double total_irrigation_mm = 1;
  double total_effective_rainfall_mm = 2;
  double total_crop_et_mm = 3;
  double total_deep_percolation_mm = 4;
  int32 irrigation_events = 5;
  double average_interval_days = 6;
  double water_use_efficiency = 7;
}

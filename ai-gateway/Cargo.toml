[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2021"
description = "AI Gateway gRPC service wrapping Rust ML engines for Go microservice consumption"

[dependencies]
# gRPC / protobuf
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Rust AI/ML engines (workspace path dependencies)
yield-prediction-engine = { path = "../rust-engines/yield-prediction-engine" }
satellite-ndvi-engine = { path = "../rust-engines/satellite-ndvi-engine" }
crop-recommendation-engine = { path = "../rust-engines/crop-recommendation-engine" }
plant-ai-inference-engine = { path = "../rust-engines/plant-ai-inference-engine" }
disease-detection-engine = { path = "../rust-engines/disease-detection-engine" }
pest-detection-engine = { path = "../rust-engines/pest-detection-engine" }
plant-classification-engine = { path = "../rust-engines/plant-classification-engine" }
nutrient-deficiency-engine = { path = "../rust-engines/nutrient-deficiency-engine" }
crop-growth-engine = { path = "../rust-engines/crop-growth-engine" }
soil-nutrient-engine = { path = "../rust-engines/soil-nutrient-engine" }
climate-response-engine = { path = "../rust-engines/climate-response-engine" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
ndarray = "0.16"

[build-dependencies]
tonic-build = "0.12"

# Training configuration for YieldPoint vision models.
# Each task trains a separate model from data collected by the AI gateway.

[data]
base_dir = "/data/training-collection"
train_split = 0.8
val_split = 0.1
test_split = 0.1
min_samples_per_class = 20
min_confidence = 0.7

# Relative trust in labels by origin. Scales each sample's contribution to the
# class weights used by the loss. Human-reviewed labels bypass min_confidence;
# corrected labels replace the auto-label; rejected samples are dropped.
[data.provenance_weights]
human = 1.0
external_api = 0.6
local_model = 0.3

[tasks.disease]
input_size = 256
num_epochs = 50
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
label_smoothing = 0.1
early_stopping_patience = 10
output_model = "/models/disease-detection-v1/model.onnx"

[tasks.pest]
input_size = 640
num_epochs = 50
batch_size = 16
learning_rate = 0.001
weight_decay = 0.0001
label_smoothing = 0.1
early_stopping_patience = 10
output_model = "/models/pest-detection-v1/model.onnx"

[tasks.nutrient_deficiency]
input_size = 256
num_epochs = 50
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
label_smoothing = 0.1
early_stopping_patience = 10
output_model = "/models/nutrient-deficiency-v1/model.onnx"

[tasks.classification]
input_size = 224
num_epochs = 50
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
label_smoothing = 0.1
early_stopping_patience = 10
output_model = "/models/plant-classification-v1/model.onnx"

# Tabular regression tasks (gradient-boosted trees, JSON artifact served by the AI gateway).
# The CSV is assembled from the warehouse: one row per field-season with the
# yield-prediction-engine FEATURE_NAMES columns plus the target.
[tabular.yield]
data_csv = "/data/training-collection/yield/field_seasons.csv"
target_column = "yield_kg_ha"
n_trees = 300
max_depth = 4
learning_rate = 0.05
min_samples_leaf = 5
subsample = 0.8
interval_coverage = 0.9
min_r_squared = 0.5
output_model = "/models/yield-gbm-v1/model.json"

[augmentation]
horizontal_flip = true
vertical_flip = false
rotation_limit = 30
brightness_range = [0.8, 1.2]
random_crop_scale = [0.8, 1.0]

[export]
onnx_opset = 17
dynamic_batch = true

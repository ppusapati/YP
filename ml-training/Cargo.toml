[package]
name = "yp-ml-training"
version = "0.1.0"
edition = "2021"
description = "ML training pipeline for YieldPoint vision models — trains custom ONNX models from data collected by the AI gateway"

[dependencies]
# ML framework
burn = { version = "0.16", features = ["dataset"] }
burn-ndarray = "0.16"
burn-autodiff = "0.16"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# ONNX protobuf export
prost = "0.13"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
rand = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
wgpu = ["burn/wgpu"]

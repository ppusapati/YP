# Integration-test stack: PostgreSQL only, port 5433 to avoid dev conflicts.
# Usage: docker compose -f docker-compose.test.yml up -d
#        docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yieldpoint_test
      POSTGRES_PASSWORD: yieldpoint_test
      POSTGRES_DB: yieldpoint_test
    volumes:
      - ../../scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yieldpoint_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data  # RAM-only for speed; data is ephemeral

# YieldPoint — Local Development Stack
# Usage: docker compose up -d
# Ports: api-gateway 8080, postgres 5432, kafka 9092, ai-gateway 50051
# All client traffic enters through the api-gateway on port 8080.
# Individual service ports (8081-8092) are still exposed for debugging.

x-go-service: &go-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &go-env
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
    KAFKA_BROKER: kafka:9092
    GRPC_PLAINTEXT: "1"
    PORT: "8080"
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    S3_BUCKET: yieldpoint
    S3_FORCE_PATH_STYLE: "true"
    S3_REGION: us-east-1
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
      reservations:
        memory: 128M
        cpus: '0.25'

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    # TimescaleDB rather than stock PostgreSQL.
    #
    # This image is PostgreSQL 16 with the timescaledb extension available; it
    # is a drop-in, and the twenty-odd service databases that do not use
    # hypertables are unaffected. sensor-service needs it: sensor_readings is
    # the one table here that grows without bound, and migration 000006 turns
    # it into a hypertable.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-yieldpoint}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    # Log anything slower than a second and keep per-statement timings.
    # Without this the answer to "which query is slow" is a guess; with it,
    # pg_stat_statements ranks them and the log names the offending call.
    # One second is deliberately not aggressive: a threshold that fires on
    # ordinary queries produces a log nobody reads.
    command:
      - postgres
      - -c
      # timescaledb must come first in the list; it refuses to load otherwise.
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=0
      - -c
      - log_autovacuum_min_duration=0
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yieldpoint}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # A second PostgreSQL, with pgvector, for advisory-service alone.
  #
  # The shared instance above is TimescaleDB, which does not ship the vector
  # extension, and advisory-service's first migration creates it and fails
  # without it. Three ways out of that were possible: swap the shared image and
  # disturb twenty-three working services, degrade the migration to a text
  # column and ship retrieval that quietly returns nothing relevant, or give
  # the one service with a hard requirement its own database. This is the third.
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: advisory_service
    volumes:
      - pgvectordata:/var/lib/postgresql/data
    ports:
      # 5433: 5432 is the shared instance.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yieldpoint} -d advisory_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zkdata:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafkadata:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set yp http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY;
      mc mb --ignore-existing yp/yieldpoint;
      exit 0;
      "
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ── API Gateway (single entry point) ───────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      auth-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      field-service:
        condition: service_healthy
      crop-service:
        condition: service_healthy
      sensor-service:
        condition: service_healthy
      irrigation-service:
        condition: service_healthy
      soil-service:
        condition: service_healthy
      yield-service:
        condition: service_healthy
      pest-prediction-service:
        condition: service_healthy
      plant-diagnosis-service:
        condition: service_healthy
      satellite-service:
        condition: service_healthy
      traceability-service:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      prescription-service:
        condition: service_healthy
      satellite-ingestion-service:
        condition: service_healthy
      satellite-processing-service:
        condition: service_healthy
      satellite-analytics-service:
        condition: service_healthy
      satellite-tile-service:
        condition: service_healthy
      vegetation-index-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      agronomy-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ── Go Agriculture Services ───────────────────────────────────────────────

  farm-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: farm-service
    ports:
      - "8081:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${FARM_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/farm_service?sslmode=disable}

  field-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: field-service
    ports:
      - "8082:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${FIELD_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/field_service?sslmode=disable}
      FARM_SERVICE_URL: http://farm-service:8080
      CROP_SERVICE_URL: http://crop-service:8080

  crop-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: crop-service
    ports:
      - "8083:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${CROP_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/crop_service?sslmode=disable}

  sensor-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: sensor-service
    ports:
      - "8084:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SENSOR_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/sensor_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      FARM_SERVICE_URL: http://farm-service:8080

  irrigation-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: irrigation-service
    ports:
      - "8085:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${IRRIGATION_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/irrigation_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      FARM_SERVICE_URL: http://farm-service:8080
      WEATHER_SERVICE_URL: http://weather-service:8080
      AI_GATEWAY_URL: ai-gateway:50051
      # Actuation. Without at least one of these, TriggerIrrigation and
      # StopIrrigation refuse every request rather than recording runs that
      # never happened — which is the honest behaviour for a deployment with
      # no hardware, and is logged loudly at startup.
      MQTT_BROKER_URL: tcp://rmqtt:1883
      MQTT_CLIENT_ID: irrigation-service
      # A LoRaWAN network server is site-specific: set LORAWAN_SERVER_URL and
      # LORAWAN_API_TOKEN where one exists. Unset here, so the protocol is
      # refused by name rather than routed over whichever client does exist.
      LORAWAN_SERVER_URL: ${LORAWAN_SERVER_URL:-}
      LORAWAN_API_TOKEN: ${LORAWAN_API_TOKEN:-}
      # Modbus needs no shared config — the panel's address is the
      # controller's own endpoint — so it is on unless turned off.
      MODBUS_ENABLED: "true"
      # How often finished runs are closed and their meters read. A start
      # command carries a duration the controller enforces locally, so the
      # valve shuts on its own and nothing tells this service; every
      # sensor-driven run ends that way. Set to 0 to disable, which means
      # water usage is recorded only for runs stopped by hand.
      RUN_CLOSE_INTERVAL: ${RUN_CLOSE_INTERVAL:-1m}
      # The sweep above reads across every tenant, and the application pool
      # scopes each connection to the caller's tenant — so it needs a role
      # row-level security does not apply to. Unset here because this stack
      # connects as the superuser `yieldpoint`, which already bypasses RLS;
      # in production point it at a role with BYPASSRLS. The service probes
      # at startup and logs an error if the role cannot read across tenants.
      DATABASE_URL_SYSTEM: ${IRRIGATION_SERVICE_SYSTEM_DATABASE_URL:-}
    depends_on:
      rmqtt:
        condition: service_started

  # MQTT broker for irrigation controllers.
  #
  # Commands go to <controller endpoint>/cmd and the panel answers on
  # /ack. The ack matters: a broker's PUBACK says the broker has the
  # message, not that a valve moved, so irrigation-service waits for the
  # controller's own reply before recording a run.
  rmqtt:
    image: rmqtt/rmqtt:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"

  soil-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: soil-service
    ports:
      - "8086:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SOIL_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/soil_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      FARM_SERVICE_URL: http://farm-service:8080

  yield-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: yield-service
    ports:
      - "8087:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${YIELD_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/yield_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      SOIL_SERVICE_URL: http://soil-service:8080
      IRRIGATION_SERVICE_URL: http://irrigation-service:8080
      PEST_PREDICTION_SERVICE_URL: http://pest-prediction-service:8080
      CROP_SERVICE_URL: http://crop-service:8080
      FARM_SERVICE_URL: http://farm-service:8080
      AI_GATEWAY_URL: ai-gateway:50051
      # Comma-separated tenants whose in-season forecasts are recomputed
      # weekly. Background work has no request to inherit a tenant from, so
      # running unscoped would see nothing under row-level security.
      YIELD_REFRESH_TENANTS: ""
      YIELD_REFRESH_INTERVAL: 168h
      WEATHER_SERVICE_URL: http://weather-service:8080

  pest-prediction-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: pest-prediction-service
    ports:
      - "8088:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${PEST_PREDICTION_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/pest_prediction_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      SENSOR_SERVICE_URL: http://sensor-service:8080
      FARM_SERVICE_URL: http://farm-service:8080
      # Without this, pest risk uses whatever weather the caller sent rather
      # than the field's own observations.
      WEATHER_SERVICE_URL: http://weather-service:8080
      AI_GATEWAY_URL: ai-gateway:50051

  plant-diagnosis-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: plant-diagnosis-service
    ports:
      - "8089:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${PLANT_DIAGNOSIS_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/plant_diagnosis_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      FARM_SERVICE_URL: http://farm-service:8080
      AI_GATEWAY_URL: ai-gateway:50051

  satellite-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: satellite-service
    ports:
      - "8090:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SATELLITE_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/satellite_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      FARM_SERVICE_URL: http://farm-service:8080
      AI_GATEWAY_URL: ai-gateway:50051

  traceability-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: traceability-service
    ports:
      - "8091:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${TRACEABILITY_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/traceability_service?sslmode=disable}
      FARM_SERVICE_URL: http://farm-service:8080
      FIELD_SERVICE_URL: http://field-service:8080
      YIELD_SERVICE_URL: http://yield-service:8080
      CROP_SERVICE_URL: http://crop-service:8080

  commerce-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: commerce-service
    ports:
      - "8092:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${COMMERCE_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/commerce_service?sslmode=disable}
      FARM_SERVICE_URL: http://farm-service:8080
      CROP_SERVICE_URL: http://crop-service:8080
      TRACEABILITY_SERVICE_URL: http://traceability-service:8080

  auth-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: auth-service
    ports:
      - "8093:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${AUTH_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/auth_service?sslmode=disable}

  alert-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: alert-service
    ports:
      - "8098:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${ALERT_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/alert_service?sslmode=disable}
      AI_GATEWAY_ADDR: ai-gateway:50051
      # Field conditions for risk evaluation. Without these the AI gateway
      # substitutes its own defaults — 22C, 30% soil moisture — so a risk score
      # describes an imaginary field rather than the one asked about.
      WEATHER_SERVICE_URL: http://weather-service:8080
      SOIL_SERVICE_URL: http://soil-service:8080
      # Pest, disease and nutrient risk come from what was found in the field's
      # plants, not from a forecast. Without this they score zero on every
      # field, which reads the same as a farm where nothing is ever wrong.
      PLANT_DIAGNOSIS_SERVICE_URL: http://plant-diagnosis-service:8080
      # The consumer is what fills this service. Weather, sensor and pest all
      # raise their alerts as events; without a broker alert-service is a store
      # with no writer.
      KAFKA_BROKER: kafka:9092
      # How often configured alert rules are evaluated. Set to 0 to turn the
      # scanner off; it is the only thing that reads the thresholds farmers set
      # in the web app, so off means those rules never fire.
      ALERT_SCAN_INTERVAL: ${ALERT_SCAN_INTERVAL:-5m}
      # The scanner enumerates every tenant's due rules, and the application
      # pool scopes each connection to the caller's tenant — so it needs a
      # role row-level security does not apply to. Unset here because this
      # stack connects as the superuser `yieldpoint`, which already bypasses
      # RLS; in production point it at a role with BYPASSRLS. The service
      # probes at startup and logs an error if the role cannot.
      DATABASE_URL_SYSTEM: ${ALERT_SERVICE_SYSTEM_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: analytics-service
    ports:
      - "8099:8080"
    environment:
      <<: *go-env
    depends_on:
      kafka:
        condition: service_healthy

  prescription-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: prescription-service
    ports:
      - "8100:8080"
    environment:
      <<: *go-env
    depends_on:
      kafka:
        condition: service_healthy

  satellite-ingestion-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: satellite-ingestion-service
    ports:
      - "8101:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SATELLITE_INGESTION_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/satellite_ingestion_service?sslmode=disable}

  satellite-processing-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: satellite-processing-service
    ports:
      - "8102:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SATELLITE_PROCESSING_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/satellite_processing_service?sslmode=disable}

  satellite-analytics-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: satellite-analytics-service
    ports:
      - "8103:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SATELLITE_ANALYTICS_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/satellite_analytics_service?sslmode=disable}
      VEGETATION_INDEX_SERVICE_URL: http://vegetation-index-service:8080

  satellite-tile-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: satellite-tile-service
    ports:
      - "8104:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SATELLITE_TILE_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/satellite_tile_service?sslmode=disable}

  vegetation-index-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: vegetation-index-service
    ports:
      - "8105:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${VEGETATION_INDEX_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/vegetation_index_service?sslmode=disable}

  task-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: task-service
    ports:
      - "8106:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${TASK_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/task_service?sslmode=disable}

  agronomy-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: agronomy-service
    ports:
      - "8107:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${AGRONOMY_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/agronomy_service?sslmode=disable}

  weather-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: weather-service
    ports:
      - "8108:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${WEATHER_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/weather_service?sslmode=disable}
      FIELD_SERVICE_URL: http://field-service:8080
      WEATHER_POLL_INTERVAL: ${WEATHER_POLL_INTERVAL:-1h}
      WEATHER_DEFAULT_PROVIDER: ${WEATHER_DEFAULT_PROVIDER:-OPEN_METEO}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Left empty, the adapters call the real public APIs. Point these at the
      # mockserver below to develop and test without network access or a key:
      #   docker compose --profile offline up
      # and set the three in .env — see .env.example.
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-}

  market-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: market-service
    ports:
      - "8109:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${MARKET_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/market_service?sslmode=disable}

  device-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: device-service
    ports:
      - "8110:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${DEVICE_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/device_service?sslmode=disable}

  soil-lab-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: soil-lab-service
    ports:
      - "8111:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SOIL_LAB_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/soil_lab_service?sslmode=disable}
      SOIL_SERVICE_URL: http://soil-service:8080

  planning-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: planning-service
    ports:
      - "8112:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${PLANNING_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/planning_service?sslmode=disable}
      # Optional. Without it a sowing window comes from the crop calendar and
      # says so; with it the window follows the monsoon's local onset, which is
      # what actually decides when a kharif crop goes in.
      WEATHER_SERVICE_URL: http://weather-service:8080

  sustainability-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: sustainability-service
    ports:
      - "8113:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${SUSTAINABILITY_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/sustainability_service?sslmode=disable}

  finance-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: finance-service
    ports:
      - "8114:8080"
    environment:
      <<: *go-env
      DATABASE_URL: ${FINANCE_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@postgres:5432/finance_service?sslmode=disable}
      # Everything here rests on the harvest record: without yield-service a
      # quote is priced from a crop benchmark and a credit assessment is
      # refused outright.
      YIELD_SERVICE_URL: http://yield-service:8080
      # Both claim-evidence sources are optional. A missing one produces an
      # inconclusive entry in the pack rather than a silently shorter pack.
      SATELLITE_SERVICE_URL: http://satellite-service:8080
      WEATHER_SERVICE_URL: http://weather-service:8080

  advisory-service:
    <<: *go-service
    build:
      context: .
      args:
        SERVICE: advisory-service
    ports:
      - "8115:8080"
    depends_on:
      pgvector:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *go-env
      # Its own database, on the pgvector instance rather than the shared one.
      DATABASE_URL: ${ADVISORY_SERVICE_DATABASE_URL:-postgres://yieldpoint:yieldpoint@pgvector:5432/advisory_service?sslmode=disable}

      # The model. Left unset by default, and that is a supported state: with
      # no key the assistant still retrieves, still scopes to the tenant, still
      # evaluates and still logs — it quotes the retrieved passages instead of
      # writing an answer, and says so in the answer itself.
      ADVISORY_LLM_API_KEY: ${ADVISORY_LLM_API_KEY:-}
      ADVISORY_LLM_MODEL: ${ADVISORY_LLM_MODEL:-}
      # Token prices, in millionths of a currency unit per million tokens.
      # Without them every exchange is costed at zero and only the daily
      # question limit bounds spend, which the service warns about at startup.
      ADVISORY_LLM_INPUT_MICROS_PER_MTOK: ${ADVISORY_LLM_INPUT_MICROS_PER_MTOK:-}
      ADVISORY_LLM_OUTPUT_MICROS_PER_MTOK: ${ADVISORY_LLM_OUTPUT_MICROS_PER_MTOK:-}

      # An embedding endpoint, if there is one. Without it retrieval falls back
      # to a local hashed-lexical vector, which is not semantic and is named as
      # such on every document it indexes.
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}

      # The services the assistant can call rather than guess. Each is
      # optional; the tool list it is offered contains only what is reachable.
      FIELD_SERVICE_URL: http://field-service:8080
      YIELD_SERVICE_URL: http://yield-service:8080
      IRRIGATION_SERVICE_URL: http://irrigation-service:8080
      PEST_PREDICTION_SERVICE_URL: http://pest-prediction-service:8080
      WEATHER_SERVICE_URL: http://weather-service:8080
      ALERT_SERVICE_URL: http://alert-service:8080
      PRESCRIPTION_SERVICE_URL: http://prescription-service:8080
      PLANT_DIAGNOSIS_SERVICE_URL: http://plant-diagnosis-service:8080

  # ── Offline development ────────────────────────────────────────────────────
  # Stand-ins for the external APIs (Open-Meteo, OpenWeather, PlantNet, Google
  # Vision), so the platform runs with no network access, no API keys, and
  # nobody else's rate limit. Responses are deterministic, so tests can assert
  # on them. Opt in with: docker compose --profile offline up
  mockserver:
    build:
      context: .
      args:
        CMD_PATH: ./cmd/mockserver
    profiles: ["offline"]
    restart: unless-stopped
    command: ["-addr", ":8199", "-v"]
    ports:
      # 8199, not 8099: the 8080-8108 block is already spoken for by the
      # services, and analytics-service publishes 8099.
      - "8199:8199"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8199/__mock/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Real-time transport ────────────────────────────────────────────────────
  #
  # /ws and /events, which nothing else in the platform serves. It replaces the
  # monolith, which mounted them alongside a stale second copy of twenty-two
  # services.
  #
  # Not behind a profile. The api-gateway proxies /ws and /events here
  # unconditionally, so while this was `profiles: ["monolith"]` a plain
  # `docker compose up` left the gateway pointing at a host that did not exist:
  # the live field map and collaborative inspection were a connection refused
  # in the default stack.
  realtime:
    build:
      context: .
      # The shared Dockerfile, with CMD_PATH pointing at a package that is not
      # a service. A second Dockerfile for one binary is a second place for the
      # Go version, the base image and the non-root user to drift.
      args:
        CMD_PATH: ./cmd/realtime
    restart: unless-stopped
    ports:
      - "8120:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      PORT: "8080"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    # No database and no Kafka. The hub, broker, presence and session store are
    # in memory, and durable state belongs to the services that own it.
    #
    # packages/websocket has a Kafka→hub bridge, but nothing mounts it — here or
    # anywhere — and it would drop every message if it were: it reads tenant_id
    # from the top level of the payload and the domain event envelope carries no
    # such field. Giving this container a KAFKA_BROKER it never dials would
    # describe a data path that does not exist. See docs/realtime-topics.md.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Rust AI Gateway ────────────────────────────────────────────────────────

  ai-gateway:
    build:
      context: .
      dockerfile: ai-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: ai_gateway=info
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # Transaction pooling in front of Postgres.
  #
  # Every service keeps its own connection pool, and the sum of two dozen of
  # them is what exhausts max_connections long before the database runs out of
  # anything else. Services reach this by pointing DATABASE_URL at pgbouncer
  # instead of postgres; it is not in the default path because transaction
  # pooling forbids session state (prepared statements, LISTEN, advisory locks
  # held across statements), so a service has to be checked before it moves.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-yieldpoint}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yieldpoint}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # Without this, transaction pooling breaks any driver that prepares
      # statements — which is most of them.
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # ── Metric exporters ────────────────────────────────────────────────────────
  #
  # Prometheus scraped postgres:5432 and kafka:9092 directly, which serve the
  # Postgres and Kafka wire protocols rather than metrics — those jobs never
  # produced a single sample. These translate.

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # sslmode=disable is correct inside the compose network; the exporter
      # never leaves it.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-yieldpoint}:${POSTGRES_PASSWORD:-yieldpoint}@postgres:5432/${POSTGRES_DB:-yieldpoint}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "9187:9187"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    depends_on:
      - kafka
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ── Monitoring ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ── Log aggregation ────────────────────────────────────────────────────────
  #
  # Metrics say a service is failing; logs say why. Prometheus and Grafana were
  # already here, so this adds the half that was missing.
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      # Alert rules. The `fake/` subdirectory is the tenant id Loki uses when
      # auth_enabled is false; rules outside it are silently never loaded.
      - ./monitoring/loki/rules:/loki/rules:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Loki reports not-ready for a while after start while it joins its own
      # ring; failing the healthcheck during that window would restart it in a
      # loop.
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only, and only for discovery and log reads. Promtail never needs
      # to start or stop anything.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Persisted so a restart does not re-ship every line from the beginning.
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      # The dashboards themselves. The provisioning config has always pointed
      # at /var/lib/grafana/dashboards, and nothing was mounted there — so the
      # four checked-in dashboards had never loaded.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  pgdata:
  pgvectordata:
  zkdata:
  kafkadata:
  miniodata:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

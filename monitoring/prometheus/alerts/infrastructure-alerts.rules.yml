groups:
  - name: yieldpoint-infrastructure-alerts
    rules:
      # ── DatabaseConnectionExhaustion ─────────────────────────────────────────
      - alert: DatabaseConnectionExhaustion
        expr: >-
          100 * pg_stat_activity_count / pg_settings_max_connections > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Database connection pool > 80% ({{ $value | printf \"%.1f\" }}%)"
          description: >-
            PostgreSQL instance {{ $labels.instance }} is using more than 80%
            of its max_connections ({{ $value | printf "%.1f" }}%).
            Consider increasing pool size or investigating connection leaks.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/db-connections

      # ── DiskSpaceWarning ─────────────────────────────────────────────────────
      - alert: DiskSpaceWarning
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk usage > 80% on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is
            {{ $value | printf "%.1f" }}% full.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/disk-space

      # ── DiskSpaceCritical ────────────────────────────────────────────────────
      - alert: DiskSpaceCritical
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100) > 95
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Disk usage > 95% on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: >-
            CRITICAL: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}
            is {{ $value | printf "%.1f" }}% full. Immediate action required.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/disk-space

      # ── KafkaConsumerLag ─────────────────────────────────────────────────────
      - alert: KafkaConsumerLag
        expr: >-
          sum(kafka_consumergroup_lag) by (consumergroup, topic) > 10000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag > 10k for {{ $labels.consumergroup }}/{{ $labels.topic }}"
          description: >-
            Consumer group {{ $labels.consumergroup }} on topic
            {{ $labels.topic }} has a lag of {{ $value }} messages,
            sustained for more than 10 minutes.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/kafka-lag

      # ── HighMemoryUsage ──────────────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: >-
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Memory usage > 85% on {{ $labels.instance }}"
          description: >-
            Node {{ $labels.instance }} memory utilisation is at
            {{ $value | printf "%.1f" }}% for the last 5 minutes.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/high-memory

      # ── PodRestartLoop ───────────────────────────────────────────────────────
      - alert: PodRestartLoop
        expr: >-
          increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting repeatedly"
          description: >-
            Container {{ $labels.container }} in pod
            {{ $labels.namespace }}/{{ $labels.pod }} has restarted
            {{ $value | printf "%.0f" }} times in the last 15 minutes.
          runbook_url: https://wiki.yieldpoint.dev/runbooks/pod-restart-loop

# YieldPoint AlertManager Configuration
# ──────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@yieldpoint.dev"
  smtp_auth_username: "alertmanager@yieldpoint.dev"
  smtp_auth_password: "<SMTP_PASSWORD>"
  smtp_require_tls: true

# ── Templates ────────────────────────────────────────────────────────────────
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ── Inhibition Rules ────────────────────────────────────────────────────────
# Critical suppresses warning for the same alertname + service combination.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - alertname
      - service
      - instance

  # DiskSpaceCritical suppresses DiskSpaceWarning on the same mountpoint.
  - source_matchers:
      - alertname = "DiskSpaceCritical"
    target_matchers:
      - alertname = "DiskSpaceWarning"
    equal:
      - instance
      - mountpoint

# ── Route Tree ───────────────────────────────────────────────────────────────
route:
  receiver: default-slack
  group_by: ["alertname", "service", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts go to PagerDuty and Slack immediately.
    - matchers:
        - severity = "critical"
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity = "critical"
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts go to Slack with a longer repeat interval.
    - matchers:
        - severity = "warning"
      receiver: slack-warnings
      repeat_interval: 4h

    # Info-level alerts go to email digest.
    - matchers:
        - severity = "info"
      receiver: email-notifications
      group_wait: 1m
      repeat_interval: 12h

# ── Receivers ────────────────────────────────────────────────────────────────
receivers:
  # Default catch-all: Slack.
  - name: default-slack
    slack_configs:
      - api_url: "<SLACK_WEBHOOK_URL>"
        channel: "#yieldpoint-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} [{{ .Status | toUpper }}]'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  # Critical Slack channel (separate from general warnings).
  - name: slack-critical
    slack_configs:
      - api_url: "<SLACK_WEBHOOK_URL>"
        channel: "#yieldpoint-critical"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: 'CRITICAL: {{ .GroupLabels.alertname }} [{{ .Status | toUpper }}]'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}

  # Warning Slack channel.
  - name: slack-warnings
    slack_configs:
      - api_url: "<SLACK_WEBHOOK_URL>"
        channel: "#yieldpoint-warnings"
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: 'WARNING: {{ .GroupLabels.alertname }} [{{ .Status | toUpper }}]'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  # PagerDuty for critical alerts (on-call rotation).
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "<PAGERDUTY_ROUTING_KEY>"
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          runbook: '{{ (index .Alerts 0).Annotations.runbook_url }}'

  # Email digest for informational alerts.
  - name: email-notifications
    email_configs:
      - to: "platform-team@yieldpoint.dev"
        send_resolved: true
        headers:
          Subject: '[YieldPoint] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'

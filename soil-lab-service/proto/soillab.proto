syntax = "proto3";
package agriculture.soillab.v1;
option go_package = "p9e.in/samavaya/agriculture/soil-lab-service/api/v1;soillabv1";

import "google/protobuf/timestamp.proto";

// ReportFormat is how a lab delivered its results.
enum ReportFormat {
  REPORT_FORMAT_UNSPECIFIED = 0;
  REPORT_FORMAT_CSV         = 1;
  // A PDF is accepted and stored but not parsed. Extracting numbers from a
  // lab's PDF layout is OCR guesswork, and a mis-read potassium figure drives
  // a fertiliser prescription — so the file is kept for a human to read and
  // the values are entered rather than inferred.
  REPORT_FORMAT_PDF         = 2;
}

// ImportStatus is where one report has got to.
enum ImportStatus {
  IMPORT_STATUS_UNSPECIFIED = 0;
  IMPORT_STATUS_RECEIVED    = 1;
  IMPORT_STATUS_PARSED      = 2;
  // Parsed, but at least one row could not be matched or trusted. The report
  // is held for review rather than pushed into soil-service.
  IMPORT_STATUS_NEEDS_REVIEW = 3;
  IMPORT_STATUS_APPLIED     = 4;
  IMPORT_STATUS_REJECTED    = 5;
}

// Lab is an accredited soil testing laboratory.
message Lab {
  string id   = 1;
  string name = 2;
  string accreditation = 3;
  string contact_email = 4;
  // The column names this lab uses, so its CSVs parse without a person having
  // to rename headers before every upload.
  map<string, string> column_aliases = 5;
}

// LabResult is one analyte reading from a report row.
message LabResult {
  string analyte = 1;
  double value   = 2;
  string unit    = 3;
  // True when the value was outside the range this analyte can plausibly take,
  // which is usually a unit mismatch in the lab's export.
  bool   suspect = 4;
  string note    = 5;
}

// ReportRow is one sample's worth of results.
message ReportRow {
  int32  line_number = 1;
  string sample_ref  = 2;
  string field_id    = 3;
  double depth_cm    = 4;
  google.protobuf.Timestamp collected_on = 5;
  repeated LabResult results = 6;
  // Why this row cannot be applied, if it cannot.
  string blocker = 7;
}

// LabReport is one uploaded file and what came of it.
message LabReport {
  string id     = 1;
  string lab_id = 2;
  string lab_name = 3;

  ReportFormat format = 4;
  string       filename = 5;
  string       storage_url = 6;
  // Content hash, so the same file uploaded twice is recognised rather than
  // creating a second set of soil samples for one set of results.
  string       content_sha256 = 7;

  ImportStatus status = 8;

  int32 row_count     = 9;
  int32 applied_count = 10;
  int32 blocked_count = 11;

  repeated ReportRow rows = 12;

  google.protobuf.Timestamp uploaded_at = 13;
  google.protobuf.Timestamp applied_at  = 14;
  string uploaded_by = 15;
  string rejection_reason = 16;
}

// ── Requests / Responses ─────────────────────────────────────────────────────

message RegisterLabRequest {
  string name = 1;
  string accreditation = 2;
  string contact_email = 3;
  map<string, string> column_aliases = 4;
}

message RegisterLabResponse { Lab lab = 1; }

message ListLabsRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message ListLabsResponse {
  repeated Lab labs = 1;
  string next_page_token = 2;
  int32  total_count = 3;
}

message UploadReportRequest {
  string       lab_id   = 1;
  ReportFormat format   = 2;
  string       filename = 3;
  // The file itself. CSVs are parsed here; a PDF is stored and left for a
  // person, because reading numbers off a lab's PDF layout is guesswork and
  // the numbers drive fertiliser rates.
  bytes        content  = 4;
}

message UploadReportResponse {
  LabReport report = 1;
  // True when this exact file has been uploaded before; the existing report is
  // returned rather than a second one created.
  bool      duplicate = 2;
}

message GetReportRequest { string id = 1; }
message GetReportResponse { LabReport report = 1; }

message ListReportsRequest {
  string       lab_id = 1;
  ImportStatus status = 2;
  int32  page_size  = 3;
  string page_token = 4;
}

message ListReportsResponse {
  repeated LabReport reports = 1;
  string next_page_token = 2;
  int32  total_count = 3;
}

message ApplyReportRequest {
  string id = 1;
  // Apply the rows that are usable even though others are blocked. Off by
  // default: a partial import that nobody notices leaves a field with results
  // from half its samples.
  bool   skip_blocked = 2;
}

message ApplyReportResponse {
  LabReport report = 1;
  // The soil-service sample ids created, so a caller can follow them.
  repeated string created_sample_ids = 2;
}

message RejectReportRequest { string id = 1; string reason = 2; }
message RejectReportResponse { LabReport report = 1; }

// SoilLabService imports laboratory reports and maps them onto soil samples.
service SoilLabService {
  rpc RegisterLab(RegisterLabRequest) returns (RegisterLabResponse);
  rpc ListLabs(ListLabsRequest) returns (ListLabsResponse);
  rpc UploadReport(UploadReportRequest) returns (UploadReportResponse);
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  rpc ApplyReport(ApplyReportRequest) returns (ApplyReportResponse);
  rpc RejectReport(RejectReportRequest) returns (RejectReportResponse);
}

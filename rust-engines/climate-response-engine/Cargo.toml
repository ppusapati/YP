[package]
name = "climate-response-engine"
version = "0.1.0"
edition = "2021"
description = "Empirical and physiological crop-climate response models for temperature, precipitation, CO2, and drought stress"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

[package]
name = "crop-growth-engine"
version = "0.1.0"
edition = "2021"
description = "WOFOST/DSSAT crop growth simulation engine with RK4 ODE solver for biomass, LAI, and phenological stage modeling"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

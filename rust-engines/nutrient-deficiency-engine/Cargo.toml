[package]
name = "nutrient-deficiency-engine"
version = "0.1.0"
edition = "2021"
description = "DenseNet-121 nutrient deficiency detection engine with 10 nutrient classes and ordinal severity regression"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

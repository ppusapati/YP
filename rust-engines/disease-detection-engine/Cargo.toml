[package]
name = "disease-detection-engine"
version = "0.1.0"
edition = "2021"
description = "EfficientNet-B4 + U-Net disease detection inference engine with 38 PlantVillage disease classes"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

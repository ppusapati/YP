[package]
name = "pest-detection-engine"
version = "0.1.0"
edition = "2021"
description = "MobileNetV3-Large pest detection engine with 23 pest classes, bbox support, and treatment recommendations"

[features]
default = []
onnx = ["ort"]

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
ort = { version = "2.0.0-rc.13", optional = true }

[dev-dependencies]
approx = "0.5"

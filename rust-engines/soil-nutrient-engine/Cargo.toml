[package]
name = "soil-nutrient-engine"
version = "0.1.0"
edition = "2021"
description = "Finite difference solver for 2D soil nutrient transport with diffusion, advection, and source/sink terms"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/yieldpoint

jobs:
  build-and-push-services:
    name: Build & Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - advisory-service
          - agronomy-service
          - alert-service
          - analytics-service
          - auth-service
          - commerce-service
          - crop-service
          - device-service
          - farm-service
          - field-service
          - finance-service
          - irrigation-service
          - market-service
          - pest-prediction-service
          - plant-diagnosis-service
          - planning-service
          - prescription-service
          - satellite-analytics-service
          - satellite-ingestion-service
          - satellite-processing-service
          - satellite-service
          - satellite-tile-service
          - sensor-service
          - soil-lab-service
          - soil-service
          - sustainability-service
          - task-service
          - traceability-service
          - vegetation-index-service
          - weather-service
          - yield-service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every build recompiles every layer from scratch.
          # Scoped per service so one image's cache cannot evict another's.
          cache-from: type=gha,scope=${{ matrix.service || github.job }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service || github.job }}

  build-and-push-monolith:
    name: Build & Push (monolith)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/monolith
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/monolith/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every build recompiles every layer from scratch.
          # Scoped per service so one image's cache cannot evict another's.
          cache-from: type=gha,scope=${{ matrix.service || github.job }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service || github.job }}

  build-and-push-ai-gateway:
    name: Build & Push (ai-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/ai-gateway
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every build recompiles every layer from scratch.
          # Scoped per service so one image's cache cannot evict another's.
          cache-from: type=gha,scope=${{ matrix.service || github.job }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service || github.job }}

  build-and-push-api-gateway:
    name: Build & Push (api-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api-gateway
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.job }}
          cache-to: type=gha,mode=max,scope=${{ github.job }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs:
      - build-and-push-services
      - build-and-push-monolith
      - build-and-push-ai-gateway
      - build-and-push-api-gateway
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        env:
          NAMESPACE: yieldpoint-staging
        run: |
          TAG=sha-${GITHUB_SHA::7}

          # `kubectl kustomize` on the overlay, not a glob over the base.
          #
          # The glob applied k8s/base directly, so staging got production
          # replica counts, production resource limits and the production
          # ingress host — the overlay that exists to change all three was
          # never read. It also fed kustomization.yaml itself to kubectl,
          # which is not a Kubernetes object.
          #
          # The tag substitution is anchored to the image line and to this
          # registry, so it cannot rewrite an unrelated string that happens to
          # contain ":latest".
          kubectl kustomize k8s/overlays/staging \
            | sed -E "s|(image: ghcr\.io/[^:[:space:]]+):latest|\1:${TAG}|g" \
            | kubectl apply -f -

          ./scripts/verify-rollout.sh "$NAMESPACE"

      - name: Roll back on failure
        if: failure()
        env:
          NAMESPACE: yieldpoint-staging
        run: ./scripts/rollback.sh "$NAMESPACE"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - build-and-push-services
      - build-and-push-monolith
      - build-and-push-ai-gateway
      - build-and-push-api-gateway
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      # The gateway goes out on a canary first.
      #
      # Every request to the platform passes through it, so it is the one
      # component where a bad build is visible within a minute of taking real
      # traffic — and the one where finding out after a full rollout means
      # finding out from users. The canary runs beside the stable pods behind
      # the same Service, takes a share of traffic proportional to its pod
      # count, and is judged on its own pods rather than on the Service's
      # aggregate, which four healthy stable pods would dilute into noise.
      - name: Canary the API gateway
        env:
          NAMESPACE: yieldpoint
        run: |
          TAG=${{ github.ref_name }}
          ./scripts/canary-deploy.sh "$NAMESPACE" api-gateway \
            "ghcr.io/${{ github.repository_owner }}/yieldpoint/api-gateway:${TAG}" \
            180 1

      - name: Deploy to production
        env:
          NAMESPACE: yieldpoint
        run: |
          TAG=${{ github.ref_name }}

          kubectl kustomize k8s/overlays/production \
            | sed -E "s|(image: ghcr.io/[^:]+):latest|\1:${TAG}|g" \
            | kubectl apply -f -

          ./scripts/verify-rollout.sh "$NAMESPACE"

      # A failed rollout leaves the previous ReplicaSet in place and the new
      # pods crash-looping, which is worse than either version alone: the
      # Service has some old pods and some broken ones. Undo puts every
      # deployment back on its last working ReplicaSet.
      - name: Roll back on failure
        if: failure()
        env:
          NAMESPACE: yieldpoint
        run: ./scripts/rollback.sh "$NAMESPACE"

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - farm-service
          - field-service
          - crop-service
          - sensor-service
          - irrigation-service
          - soil-service
          - yield-service
          - pest-prediction-service
          - plant-diagnosis-service
          - satellite-service
          - traceability-service
          - commerce-service
          - auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.service }}
        run: go build -trimpath ./${{ matrix.service }}/cmd/server
      - name: Vet ${{ matrix.service }}
        run: go vet ./${{ matrix.service }}/...

  test-packages:
    name: Test shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run package tests
        run: go test -race -count=1 -timeout=5m ./packages/...

  test-services:
    name: Test services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run service tests
        run: |
          go test -race -count=1 -timeout=5m \
            ./farm-service/... \
            ./field-service/... \
            ./crop-service/... \
            ./sensor-service/... \
            ./irrigation-service/... \
            ./soil-service/... \
            ./yield-service/... \
            ./pest-prediction-service/... \
            ./plant-diagnosis-service/... \
            ./satellite-service/... \
            ./traceability-service/... \
            ./commerce-service/... \
            ./auth-service/...

  proto-check:
    name: Proto freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
      - name: Generate and check for drift
        run: |
          buf generate
          git diff --exit-code -- '*.pb.go' '*.connect.go' || \
            (echo "Proto generated code is stale — run 'buf generate' and commit" && exit 1)

  rust-engines:
    name: Rust engines check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-engines
      - name: Cargo check
        working-directory: rust-engines
        run: cargo check --workspace
      - name: Cargo test
        working-directory: rust-engines
        run: cargo test --workspace

  rust-ai-gateway:
    name: Rust AI gateway check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-gateway
      - name: Cargo check
        working-directory: ai-gateway
        run: cargo check
      - name: Cargo test
        working-directory: ai-gateway
        run: cargo test

  integration-test:
    name: Integration tests (e2e)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yieldpoint_test
          POSTGRES_PASSWORD: yieldpoint_test
          POSTGRES_DB: yieldpoint_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yieldpoint_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run e2e integration tests
        env:
          DATABASE_URL: postgres://yieldpoint_test:yieldpoint_test@localhost:5433/yieldpoint_test?sslmode=disable
        run: |
          go test -tags=e2e -v -count=1 -timeout=5m ./tests/integration/...

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - farm-service
          - field-service
          - crop-service
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t yieldpoint/${{ matrix.service }}:ci \
            .

  docker-build-ai-gateway:
    name: Docker build (ai-gateway)
    runs-on: ubuntu-latest
    needs: [rust-ai-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build AI Gateway Docker image
        run: |
          docker build \
            -f ai-gateway/Dockerfile \
            -t yieldpoint/ai-gateway:ci \
            .

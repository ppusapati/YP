name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          args: --timeout=5m

  manifests:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # The check that stops a service being built, pushed and never deployed.
      #
      # Before this existed, k8s/base listed three of thirty services and the CD
      # pipeline reported a successful deploy every time, because a manifest
      # that is absent produces no error and `kubectl rollout status` on a label
      # selector matching three deployments exits zero. The generated manifests
      # and the build matrices are now all derived from docker-compose.yml, and
      # this fails the build the moment any of them drift apart.
      - name: Manifests match the service list
        run: python3 scripts/k8s-manifests.py --check

      # The same class of drift, one directory over. docs/api/ held specs for
      # nine services the generator no longer touched and none at all for nine
      # more, and every port in it was off by one position — farm documented on
      # 8080, which is the gateway; field on 8081, which is farm — so each spec
      # sent its reader to the next service along. These specs are hand-written
      # and nothing regenerates them, which is why an added RPC needs a check
      # rather than a rebuild.
      - name: API specs match the protos
        run: ./scripts/generate-api-docs.sh --check

      # A generated proto module that the TS barrel does not re-export is a
      # service the web app cannot reach, and an absence is not a compile error.
      # Twenty-eight of forty-seven were exported, which is how eleven finished
      # services had no client.
      - name: Proto barrel exports every generated module
        run: python3 scripts/check-proto-barrel.py

      # The same for Flutter: eighteen hand-written clients against thirty-one
      # services. The thirteen new ones are generated from the protos, so this
      # fails when a proto gains an RPC and the client does not.
      - name: Dart service clients match the protos
        run: python3 scripts/gen-dart-clients.py --check

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Kustomize overlays build
        run: |
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash -s -- 5.4.3 "$RUNNER_TEMP"
          for overlay in k8s/overlays/*/; do
            echo "--- $overlay"
            # A patch that targets a resource which no longer exists, or a
            # JSON-patch path into a field the base does not have, fails here
            # rather than halfway through a production deploy.
            "$RUNNER_TEMP/kustomize" build "$overlay" > /dev/null
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - advisory-service
          - agronomy-service
          - alert-service
          - analytics-service
          - auth-service
          - commerce-service
          - crop-service
          - device-service
          - farm-service
          - field-service
          - finance-service
          - irrigation-service
          - market-service
          - pest-prediction-service
          - plant-diagnosis-service
          - planning-service
          - prescription-service
          - satellite-analytics-service
          - satellite-ingestion-service
          - satellite-processing-service
          - satellite-service
          - satellite-tile-service
          - sensor-service
          - soil-lab-service
          - soil-service
          - sustainability-service
          - task-service
          - traceability-service
          - vegetation-index-service
          - weather-service
          - yield-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.service }}
        run: |
          if [ -d "./${{ matrix.service }}/cmd/server" ]; then
            go build -trimpath ./${{ matrix.service }}/cmd/server
          else
            echo "No cmd/server entrypoint — skipping binary build"
          fi
      - name: Vet ${{ matrix.service }}
        run: go vet ./${{ matrix.service }}/...

  test-packages:
    name: Test shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -C packages, not ./packages/... — packages/ is its own Go module, so
      # the pattern matched nothing the root module owns and the command failed
      # with "main module does not contain package". This job has been red.
      - name: Run package tests
        run: go test -C packages -race -count=1 -timeout=5m ./...

  test-python-client:
    name: Test Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e clients/python
      - name: Run tests
        run: python -m unittest discover -s clients/python/tests -t clients/python

  test-services:
    name: Test services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # ./... , not a list of directories.
      #
      # The list here named twenty-four of the thirty-one services, so the tests
      # of the seven newest — advisory, device, finance, market, planning,
      # soil-lab and sustainability — had never run in CI. Nothing said so: the
      # step passed, in green, for every one of them.
      #
      # The root module contains every service, so ./... is the same set by
      # construction and cannot fall behind. The shared packages are their own
      # module and are covered by test-packages above.
      - name: Run service tests
        run: go test -race -count=1 -timeout=10m ./...

  proto-check:
    name: Proto freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
      - name: Generate and check Go proto drift
        run: |
          buf generate
          ./scripts/check-generated-drift.sh \
            "run 'buf generate' and commit" \
            '*.pb.go' '*.connect.go'

  proto-check-dart:
    name: Proto freshness (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dart-lang/setup-dart@v1
      - name: Install protoc-gen-dart
        # Pinned: 24.x resolves the well-known types to locally generated files
        # instead of package:protobuf, and 25.1.0 changes how message factories
        # construct. Either produces a diff against the committed tree that
        # looks like drift and is not. See docs/proto-generation.md.
        run: dart pub global activate protoc_plugin 25.0.0
      - name: Generate and check Dart proto drift
        run: |
          buf generate --template mobile/packages/flutter_proto/buf.gen.yaml
          ./scripts/check-generated-drift.sh \
            "run 'make proto-mobile' and commit" \
            'mobile/packages/flutter_proto/lib/src/generated/'

  proto-check-ts:
    name: Proto freshness (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The plugin comes from the lockfile, not from a global npm install.
      #
      # protoc-gen-es stamps its own version into the first line of every file
      # it generates, so generating with a version other than the one the
      # repository pins makes all 47 files differ and the check reports drift
      # that is nothing but a version bump. Four versions were in play here:
      # the committed tree said 2.14.0, the lockfile pinned 2.11.0, this step
      # installed 2.2.3, and package.json asked for ^2.0.0. The lockfile is the
      # only one of those the repository actually builds against.
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generate and check TypeScript proto drift
        run: |
          export PATH="$PWD/web/node_modules/.bin:$PATH"
          buf generate --template web/packages/proto/buf.gen.yaml
          ./scripts/check-generated-drift.sh \
            "run 'make proto-web' and commit" \
            'web/packages/proto/src/gen/'

  rust-engines:
    name: Rust engines check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-engines
      - name: Cargo check
        working-directory: rust-engines
        run: cargo check --workspace
      - name: Cargo test
        working-directory: rust-engines
        run: cargo test --workspace

  web:
    name: Web lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      # The web suite had no CI job at all, so a broken test only surfaced
      # when someone happened to run it locally.
      - name: Test
        working-directory: web
        run: pnpm test

  visual-regression:
    name: Web visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # The gallery's UnoCSS config imports the generated design-tokens theme,
      # and dist/ is gitignored — so on a fresh checkout it does not exist and
      # the gallery build fails on an unresolved import. Everything else in
      # this workspace gets it via turbo's ^build; this job builds the gallery
      # directly, so it has to ask.
      - name: Build design tokens
        working-directory: web
        run: pnpm --filter @p9e.in/samavaya build

      # Chromium only. A screenshot baseline is tied to the engine that
      # rendered it — font hinting, sub-pixel antialiasing and scrollbar width
      # all differ between browsers — so a second browser is not extra
      # coverage, it is a second set of baselines failing for reasons that have
      # nothing to do with the components.
      - name: Install Chromium
        working-directory: web/packages/ui
        run: pnpm exec playwright install --with-deps chromium

      # This is the component gallery, not the app: every component rendered
      # with fixed props and no backend, so a diff means a component changed
      # rather than that a page's data did. It replaces the Storybook that
      # cannot run against this repo's Svelte 5 — see E-006 in ENHANCEMENTS.md.
      - name: Visual regression
        working-directory: web/packages/ui
        run: pnpm test:visual

      # The report carries the expected, actual and diff image for every
      # failure. Without it a red build says "screenshot did not match" and
      # nobody can tell whether the change was intended without reproducing it
      # locally, which is the point at which a visual suite gets switched off.
      - name: Upload the diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            web/packages/ui/playwright-report-visual/
            web/packages/ui/test-results/
          retention-days: 14

  mobile:
    name: Mobile analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # A pub workspace: one resolution at the root covers both apps and all
      # seven packages, so a version conflict between them fails here rather
      # than on whichever machine happens to build next.
      - name: Resolve workspace
        working-directory: mobile
        run: flutter pub get

      # Regenerate AppLocalizations and fail if it moved.
      #
      # lib/l10n/app_localizations*.dart is generated from the ARB files and
      # committed, and `flutter analyze` does not regenerate it — so an ARB
      # edited without running gen-l10n leaves the generated Dart describing
      # the old strings, and every check here still passes. That is the same
      # hole the proto freshness jobs had, so it uses the same script.
      - name: Check l10n freshness
        working-directory: mobile/packages/flutter_l10n
        run: |
          flutter gen-l10n
          "$GITHUB_WORKSPACE/scripts/check-generated-drift.sh" \
            "run 'flutter gen-l10n' in mobile/packages/flutter_l10n and commit" \
            lib/l10n/

      # The mobile suite had no CI job at all. Two apps and seven packages —
      # every test in them only ran when someone remembered to, which is how
      # 379 analyzer errors accumulated unnoticed.
      #
      # `--fatal-infos` is deliberately not set: the repository carries about a
      # thousand lint infos (trailing commas, redundant defaults) and failing
      # on them would mean this job is red from its first run and gets ignored.
      # Errors and warnings fail; infos are reported.
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: |
          set -e
          for target in \
            apps/farmer_app \
            apps/agronomist_app \
            packages/flutter_analytics \
            packages/flutter_l10n \
            packages/flutter_map_core \
            packages/flutter_proto \
            packages/flutter_ui_core; do
            echo "── $target"
            (cd "$target" && flutter test)
          done

  mobile-integration:
    name: Mobile integration tests (emulator)
    runs-on: ubuntu-latest
    # Only on the shared branches and on PRs into them: booting an emulator
    # takes several minutes, which is too slow to sit in front of every push
    # to a topic branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        working-directory: mobile
        run: flutter pub get

      # KVM has to be enabled explicitly on GitHub's Ubuntu runners or the
      # emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # These tests start the whole app — twenty-five blocs out of a Riverpod
      # graph, three Drift schemas, a router with sixty routes. A provider that
      # throws at read time or a migration that fails on a fresh install passes
      # every unit test in the repository and gives a white screen on a phone.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd mobile/apps/farmer_app && flutter test integration_test

  todo-budget:
    name: TODO debt ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Budgets only ever go down: a change may not add markers to an area that
      # is already at its limit. Lower a budget whenever you clear one.
      - name: Check TODO budgets
        run: scripts/todo-budget.sh

  ml-training:
    name: ML training check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # tract pulls in kstring, which needs a newer toolchain than the
          # other Rust jobs pin.
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ml-training
      - name: Cargo check
        working-directory: ml-training
        run: cargo check --all-targets
      - name: Cargo test
        working-directory: ml-training
        run: cargo test

  model-gate:
    name: Model benchmark regression gate
    runs-on: ubuntu-latest
    needs: [ml-training]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ml-training
      # Candidate models are build artifacts, not repository content. When a
      # training pipeline uploads them under this name the gate runs for real;
      # otherwise every task is skipped and the job passes, so the gate never
      # blocks a change that did not touch a model.
      - name: Download candidate models
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: candidate-models
          path: ml-training/models
      - name: Run benchmark gates
        working-directory: ml-training
        run: scripts/model-gate.sh models benchmarks

  rust-ai-gateway:
    name: Rust AI gateway check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.82"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-gateway
      - name: Cargo check
        working-directory: ai-gateway
        run: cargo check
      - name: Cargo test
        working-directory: ai-gateway
        run: cargo test

  integration-test:
    name: Integration tests (e2e)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yieldpoint_test
          POSTGRES_PASSWORD: yieldpoint_test
          POSTGRES_DB: yieldpoint_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yieldpoint_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run e2e integration tests
        env:
          DATABASE_URL: postgres://yieldpoint_test:yieldpoint_test@localhost:5433/yieldpoint_test?sslmode=disable
        run: |
          go test -tags=e2e -v -count=1 -timeout=5m ./tests/integration/...

  database:
    name: Migrations and row-level security
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yieldpoint
          POSTGRES_PASSWORD: yieldpoint
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U yieldpoint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The real bootstrap sequence, in the order docker-compose runs it.
      #
      # This job exists because auth-service's 000004_add_rls could not apply
      # to a fresh database at all: it referenced a deleted_at column that
      # table has never had, so CREATE POLICY failed and the whole file rolled
      # back. Nothing caught it, because the only thing that creates an empty
      # database is a new deployment — which would have found it by failing to
      # start the authentication service.
      - name: Bootstrap the cluster
        env:
          PGHOST: localhost
          PGPORT: "5434"
          POSTGRES_USER: yieldpoint
          POSTGRES_DB: postgres
          PGPASSWORD: yieldpoint
          DB_MIGRATOR_PASSWORD: ci_migrator
          DB_APP_PASSWORD: ci_app
          DB_SYSTEM_PASSWORD: ci_system
        run: bash scripts/init-databases.sh

      # Migrations run as yp_migrator, which is how services run them: the
      # role serving requests does not have DDL. The databases are kept rather
      # than recreated, because dropping one takes the roles' per-database
      # default privileges with it.
      #
      # Services needing an extension this image does not ship (pgvector,
      # postgis, timescaledb) are skipped by name rather than silently: a
      # migration that fails for a reason other than a missing extension is
      # what this is looking for.
      - name: Apply every service's migrations as the migration role
        env:
          PGHOST: localhost
          PGPORT: "5434"
          PGUSER: yp_migrator
          PGPASSWORD: ci_migrator
          MIGRATIONCHECK_KEEP_DATABASES: "1"
        run: go run ./tools/migrationcheck

      # Row-level security, against the non-superuser role services connect
      # with.
      #
      # This is the check that matters, because the failure it guards against
      # is silent. The repositories query the pool directly, and until
      # packages/database/rlspool nothing on that path set app.tenant_id — so
      # under a role RLS applies to, every insert violated its policy and
      # every select matched nothing. It went unnoticed for as long as it did
      # because docker-compose connected as a superuser, which bypasses RLS
      # entirely: the policies had never run anywhere.
      - name: Prepare the RLS fixture database
        env:
          PGPASSWORD: yieldpoint
        run: |
          set -euo pipefail
          psql -h localhost -p 5434 -U yieldpoint -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS rlstest" -c "CREATE DATABASE rlstest"
          psql -h localhost -p 5434 -U yieldpoint -d rlstest -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO yp_app"

      - name: A pool scopes every connection to its tenant
        run: |
          go test -C packages -tags=integration -count=1 ./database/rlspool/ \
            -rls-dsn "postgres://yp_app:ci_app@localhost:5434/rlstest?sslmode=disable" \
            -rls-admin-dsn "postgres://yieldpoint:yieldpoint@localhost:5434/rlstest?sslmode=disable"

      - name: A service's repository works under the application role
        run: |
          go test -tags=integration -count=1 ./irrigation-service/internal/adapters/outbound/postgres/ \
            -irrigation-dsn "postgres://yp_app:ci_app@localhost:5434/irrigation_service?sslmode=disable"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - advisory-service
          - agronomy-service
          - alert-service
          - analytics-service
          - auth-service
          - commerce-service
          - crop-service
          - device-service
          - farm-service
          - field-service
          - finance-service
          - irrigation-service
          - market-service
          - pest-prediction-service
          - plant-diagnosis-service
          - planning-service
          - prescription-service
          - satellite-analytics-service
          - satellite-ingestion-service
          - satellite-processing-service
          - satellite-service
          - satellite-tile-service
          - sensor-service
          - soil-lab-service
          - soil-service
          - sustainability-service
          - task-service
          - traceability-service
          - vegetation-index-service
          - weather-service
          - yield-service
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t yieldpoint/${{ matrix.service }}:ci \
            .

  docker-build-realtime:
    name: Docker build (realtime)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      # Not in the matrix above: the matrix passes SERVICE, which the shared
      # Dockerfile turns into ./<service>/cmd/server, and this binary lives at
      # ./cmd/realtime. Same Dockerfile, different entry point.
      - name: Build realtime Docker image
        run: |
          docker build \
            --build-arg CMD_PATH=./cmd/realtime \
            -t yieldpoint/realtime:ci \
            .

  docker-build-ai-gateway:
    name: Docker build (ai-gateway)
    runs-on: ubuntu-latest
    needs: [rust-ai-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build AI Gateway Docker image
        run: |
          docker build \
            -f ai-gateway/Dockerfile \
            -t yieldpoint/ai-gateway:ci \
            .

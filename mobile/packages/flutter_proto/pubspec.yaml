name: flutter_proto
description: Protobuf generated models and ConnectRPC service stubs for the YieldPoint platform.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  # The runtime that matches protoc-gen-dart 25.0.0, which generated
  # lib/src/generated. It said ^21.1.2 — a protoc_plugin version, not a
  # protobuf one; the runtime has never had a 21.x, so this package could not
  # resolve and neither could the workspace that depends on it.
  protobuf: ^6.0.0
  http: ^1.2.2
  fixnum: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  test: ^1.25.8

name: flutter_ui_core
description: Shared UI components, theming, design tokens, and common widgets for YieldPoint apps.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  # Widened rather than pinned: flutter_localizations pins intl to whatever the
  # installed Flutter ships, which is 0.20.x on recent stable and 0.19.x on
  # older ones. A caret on 0.19 makes the app unresolvable on any Flutter newer
  # than the one it was written against.
  intl: ">=0.19.0 <0.21.0"
  gap: ^3.0.1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

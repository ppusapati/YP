version: v2
plugins:
  # Pin exact versions to prevent drift between developers and CI.
  # Update versions together with go.mod protobuf/connect dependencies.
  - local: protoc-gen-go
    out: .
    opt:
      - module=p9e.in/samavaya/agriculture
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=p9e.in/samavaya/agriculture
  - local: protoc-gen-connect-go
    out: .
    opt:
      - module=p9e.in/samavaya/agriculture

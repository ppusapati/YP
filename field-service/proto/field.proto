syntax = "proto3";
package agriculture.field.v1;
option go_package = "p9e.in/samavaya/agriculture/field-service/api/v1;fieldv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

// -----------------------------------------------------------------------------
// Enums
// -----------------------------------------------------------------------------

enum FieldStatus {
  FIELD_STATUS_UNSPECIFIED = 0;
  FIELD_STATUS_ACTIVE      = 1;
  FIELD_STATUS_FALLOW      = 2;
  FIELD_STATUS_PREPARATION = 3;
  FIELD_STATUS_PLANTED     = 4;
  FIELD_STATUS_HARVESTING  = 5;
  FIELD_STATUS_RETIRED     = 6;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_CROPLAND    = 1;
  FIELD_TYPE_PASTURE     = 2;
  FIELD_TYPE_ORCHARD     = 3;
  FIELD_TYPE_VINEYARD    = 4;
  FIELD_TYPE_GREENHOUSE  = 5;
  FIELD_TYPE_NURSERY     = 6;
  FIELD_TYPE_AGROFOREST  = 7;
}

enum SoilType {
  SOIL_TYPE_UNSPECIFIED = 0;
  SOIL_TYPE_CLAY        = 1;
  SOIL_TYPE_SANDY       = 2;
  SOIL_TYPE_LOAMY       = 3;
  SOIL_TYPE_SILT        = 4;
  SOIL_TYPE_PEAT        = 5;
  SOIL_TYPE_CHALK       = 6;
  SOIL_TYPE_CLAY_LOAM   = 7;
  SOIL_TYPE_SANDY_LOAM  = 8;
}

enum IrrigationType {
  IRRIGATION_TYPE_UNSPECIFIED = 0;
  IRRIGATION_TYPE_RAINFED     = 1;
  IRRIGATION_TYPE_DRIP        = 2;
  IRRIGATION_TYPE_SPRINKLER   = 3;
  IRRIGATION_TYPE_FLOOD       = 4;
  IRRIGATION_TYPE_CENTER_PIVOT = 5;
  IRRIGATION_TYPE_FURROW      = 6;
  IRRIGATION_TYPE_SUBSURFACE  = 7;
}

enum GrowthStage {
  GROWTH_STAGE_UNSPECIFIED   = 0;
  GROWTH_STAGE_GERMINATION   = 1;
  GROWTH_STAGE_SEEDLING      = 2;
  GROWTH_STAGE_VEGETATIVE    = 3;
  GROWTH_STAGE_BUDDING       = 4;
  GROWTH_STAGE_FLOWERING     = 5;
  GROWTH_STAGE_FRUIT_SET     = 6;
  GROWTH_STAGE_RIPENING      = 7;
  GROWTH_STAGE_MATURITY      = 8;
  GROWTH_STAGE_SENESCENCE    = 9;
}

enum AspectDirection {
  ASPECT_DIRECTION_UNSPECIFIED = 0;
  ASPECT_DIRECTION_NORTH       = 1;
  ASPECT_DIRECTION_NORTHEAST   = 2;
  ASPECT_DIRECTION_EAST        = 3;
  ASPECT_DIRECTION_SOUTHEAST   = 4;
  ASPECT_DIRECTION_SOUTH       = 5;
  ASPECT_DIRECTION_SOUTHWEST   = 6;
  ASPECT_DIRECTION_WEST        = 7;
  ASPECT_DIRECTION_NORTHWEST   = 8;
  ASPECT_DIRECTION_FLAT         = 9;
}

// -----------------------------------------------------------------------------
// Messages
// -----------------------------------------------------------------------------

message GeoPoint {
  double longitude = 1;
  double latitude  = 2;
}

message GeoPolygon {
  repeated GeoPoint points = 1;
}

message Field {
  string                     id                    = 1;
  string                     tenant_id             = 2;
  string                     farm_id               = 3;
  string                     name                  = 4;
  double                     area_hectares         = 5;
  GeoPolygon                 boundary              = 6;
  string                     current_crop_id       = 7;
  google.protobuf.Timestamp  planting_date         = 8;
  google.protobuf.Timestamp  expected_harvest_date = 9;
  GrowthStage                growth_stage          = 10;
  SoilType                   soil_type             = 11;
  IrrigationType             irrigation_type       = 12;
  FieldType                  field_type            = 13;
  FieldStatus                status                = 14;
  double                     elevation_meters      = 15;
  double                     slope_degrees         = 16;
  AspectDirection            aspect_direction      = 17;
  string                     created_by            = 18;
  string                     updated_by            = 19;
  google.protobuf.Timestamp  created_at            = 20;
  google.protobuf.Timestamp  updated_at            = 21;
  int64                      version               = 22;
}

message FieldBoundary {
  string                     id         = 1;
  string                     field_id   = 2;
  GeoPolygon                 polygon    = 3;
  double                     area_hectares = 4;
  double                     perimeter_meters = 5;
  string                     source     = 6;
  google.protobuf.Timestamp  recorded_at = 7;
  google.protobuf.Timestamp  created_at = 8;
}

message FieldCropAssignment {
  string                     id                    = 1;
  string                     field_id              = 2;
  string                     crop_id               = 3;
  string                     crop_variety          = 4;
  google.protobuf.Timestamp  planting_date         = 5;
  google.protobuf.Timestamp  expected_harvest_date = 6;
  google.protobuf.Timestamp  actual_harvest_date   = 7;
  GrowthStage                growth_stage          = 8;
  double                     yield_per_hectare     = 9;
  string                     notes                 = 10;
  string                     season                = 11;
  google.protobuf.Timestamp  created_at            = 12;
  google.protobuf.Timestamp  updated_at            = 13;
}

message FieldSegment {
  string                     id             = 1;
  string                     field_id       = 2;
  string                     name           = 3;
  GeoPolygon                 boundary       = 4;
  double                     area_hectares  = 5;
  SoilType                   soil_type      = 6;
  string                     current_crop_id = 7;
  string                     notes          = 8;
  int32                      segment_index  = 9;
  google.protobuf.Timestamp  created_at     = 10;
  google.protobuf.Timestamp  updated_at     = 11;
}

// -----------------------------------------------------------------------------
// Requests / Responses
// -----------------------------------------------------------------------------

message CreateFieldRequest {
  string                     farm_id               = 1;
  string                     name                  = 2;
  double                     area_hectares         = 3;
  GeoPolygon                 boundary              = 4;
  FieldType                  field_type            = 5;
  SoilType                   soil_type             = 6;
  IrrigationType             irrigation_type       = 7;
  double                     elevation_meters      = 8;
  double                     slope_degrees         = 9;
  AspectDirection            aspect_direction      = 10;
}

message CreateFieldResponse {
  Field field = 1;
}

message GetFieldRequest {
  string id = 1;
}

message GetFieldResponse {
  Field field = 1;
}

message ListFieldsRequest {
  int32  page_size   = 1;
  int32  page_offset = 2;
  string farm_id     = 3;
  FieldStatus status = 4;
  FieldType field_type = 5;
  string search      = 6;
}

message ListFieldsResponse {
  repeated Field fields     = 1;
  int32          total_count = 2;
}

message UpdateFieldRequest {
  string                     id                    = 1;
  string                     name                  = 2;
  double                     area_hectares         = 3;
  FieldType                  field_type            = 4;
  SoilType                   soil_type             = 5;
  IrrigationType             irrigation_type       = 6;
  FieldStatus                status                = 7;
  double                     elevation_meters      = 8;
  double                     slope_degrees         = 9;
  AspectDirection            aspect_direction      = 10;
  GrowthStage                growth_stage          = 11;
  google.protobuf.FieldMask  update_mask           = 12;
}

message UpdateFieldResponse {
  Field field = 1;
}

message DeleteFieldRequest {
  string id = 1;
}

message DeleteFieldResponse {}

message SetFieldBoundaryRequest {
  string     field_id         = 1;
  GeoPolygon polygon          = 2;
  string     source           = 3;
}

message SetFieldBoundaryResponse {
  FieldBoundary boundary = 1;
}

message AssignCropRequest {
  string                     field_id              = 1;
  string                     crop_id               = 2;
  string                     crop_variety          = 3;
  google.protobuf.Timestamp  planting_date         = 4;
  google.protobuf.Timestamp  expected_harvest_date = 5;
  string                     season                = 6;
  string                     notes                 = 7;
}

message AssignCropResponse {
  FieldCropAssignment assignment = 1;
}

message ListFieldsByFarmRequest {
  string farm_id     = 1;
  int32  page_size   = 2;
  int32  page_offset = 3;
}

message ListFieldsByFarmResponse {
  repeated Field fields      = 1;
  int32          total_count = 2;
}

message SegmentFieldRequest {
  string                   field_id = 1;
  repeated FieldSegmentInput segments = 2;
}

message FieldSegmentInput {
  string     name           = 1;
  GeoPolygon boundary       = 2;
  double     area_hectares  = 3;
  SoilType   soil_type      = 4;
  string     notes          = 5;
}

message SegmentFieldResponse {
  repeated FieldSegment segments = 1;
}

message GetFieldSegmentsRequest {
  string field_id = 1;
}

message GetFieldSegmentsResponse {
  repeated FieldSegment segments = 1;
}

message GetCropHistoryRequest {
  string field_id    = 1;
  int32  page_size   = 2;
  int32  page_offset = 3;
}

message GetCropHistoryResponse {
  repeated FieldCropAssignment assignments = 1;
  int32                        total_count = 2;
}

// -----------------------------------------------------------------------------
// Crop Cycles
// -----------------------------------------------------------------------------

enum CropCycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0;
  CYCLE_STATUS_PLANNED     = 1;
  CYCLE_STATUS_ACTIVE      = 2;
  CYCLE_STATUS_HARVESTING  = 3;
  CYCLE_STATUS_COMPLETED   = 4;
  CYCLE_STATUS_ABANDONED   = 5;
}

message CropCycle {
  string                     id                        = 1;
  string                     tenant_id                 = 2;
  string                     field_id                  = 3;
  string                     crop_id                   = 4;
  string                     crop_assignment_id        = 5;
  string                     season                    = 6;
  int32                      cycle_year                = 7;
  string                     name                      = 8;
  google.protobuf.Timestamp  planned_planting_date     = 9;
  google.protobuf.Timestamp  actual_planting_date      = 10;
  google.protobuf.Timestamp  planned_harvest_date      = 11;
  google.protobuf.Timestamp  actual_harvest_date       = 12;
  CropCycleStatus            status                    = 13;
  double                     target_yield_per_hectare  = 14;
  double                     actual_yield_per_hectare  = 15;
  string                     yield_unit                = 16;
  int64                      total_input_cost          = 17;
  int64                      total_revenue             = 18;
  string                     currency                  = 19;
  string                     notes                     = 20;
  int64                      version                   = 21;
  string                     created_by                = 22;
  google.protobuf.Timestamp  created_at                = 23;
  google.protobuf.Timestamp  updated_at                = 24;
}

message CreateCropCycleRequest {
  string                     field_id                  = 1;
  string                     crop_id                   = 2;
  string                     season                    = 3;
  int32                      cycle_year                = 4;
  string                     name                      = 5;
  google.protobuf.Timestamp  planned_planting_date     = 6;
  google.protobuf.Timestamp  planned_harvest_date      = 7;
  double                     target_yield_per_hectare  = 8;
  string                     yield_unit                = 9;
  string                     notes                     = 10;
}

message CreateCropCycleResponse {
  CropCycle cycle = 1;
}

message GetCropCycleRequest {
  string id = 1;
}

message GetCropCycleResponse {
  CropCycle cycle = 1;
}

message ListCropCyclesRequest {
  string           field_id    = 1;
  CropCycleStatus  status      = 2;
  int32            page_size   = 3;
  int32            page_offset = 4;
}

message ListCropCyclesResponse {
  repeated CropCycle cycles      = 1;
  int32              total_count = 2;
}

message UpdateCropCycleRequest {
  string                     id                        = 1;
  CropCycleStatus            status                    = 2;
  google.protobuf.Timestamp  actual_planting_date      = 3;
  google.protobuf.Timestamp  actual_harvest_date       = 4;
  double                     actual_yield_per_hectare  = 5;
  int64                      total_input_cost          = 6;
  int64                      total_revenue             = 7;
  string                     notes                     = 8;
  google.protobuf.FieldMask  update_mask               = 9;
}

message UpdateCropCycleResponse {
  CropCycle cycle = 1;
}

// -----------------------------------------------------------------------------
// Activity Events
// -----------------------------------------------------------------------------

enum ActivityCategory {
  CATEGORY_UNSPECIFIED     = 0;
  CATEGORY_LAND_PREP      = 1;
  CATEGORY_PLANTING       = 2;
  CATEGORY_IRRIGATION     = 3;
  CATEGORY_FERTILIZATION  = 4;
  CATEGORY_PEST_CONTROL   = 5;
  CATEGORY_SCOUTING       = 6;
  CATEGORY_HARVESTING     = 7;
  CATEGORY_POST_HARVEST   = 8;
  CATEGORY_SOIL_SAMPLING  = 9;
  CATEGORY_MAINTENANCE    = 10;
}

message ActivityEvent {
  string                     id                     = 1;
  string                     tenant_id              = 2;
  string                     field_id               = 3;
  string                     crop_cycle_id          = 4;
  string                     performed_by           = 5;
  string                     activity_type          = 6;
  ActivityCategory           category               = 7;
  google.protobuf.Timestamp  started_at             = 8;
  google.protobuf.Timestamp  completed_at           = 9;
  int32                      duration_minutes       = 10;
  string                     description            = 11;
  string                     notes                  = 12;
  string                     input_product_id       = 13;
  double                     input_quantity         = 14;
  string                     input_unit             = 15;
  int64                      input_cost             = 16;
  string                     currency               = 17;
  double                     area_hectares          = 18;
  double                     weather_temp_celsius   = 19;
  double                     weather_humidity_pct   = 20;
  double                     weather_wind_speed_kmh = 21;
  string                     weather_conditions     = 22;
  google.protobuf.Timestamp  created_at             = 23;
}

message LogActivityEventRequest {
  string                     field_id               = 1;
  string                     crop_cycle_id          = 2;
  string                     activity_type          = 3;
  ActivityCategory           category               = 4;
  google.protobuf.Timestamp  started_at             = 5;
  google.protobuf.Timestamp  completed_at           = 6;
  int32                      duration_minutes       = 7;
  string                     description            = 8;
  string                     notes                  = 9;
  string                     input_product_id       = 10;
  double                     input_quantity         = 11;
  string                     input_unit             = 12;
  int64                      input_cost             = 13;
  string                     currency               = 14;
  double                     area_hectares          = 15;
}

message LogActivityEventResponse {
  ActivityEvent event = 1;
}

message ListActivityEventsRequest {
  string            field_id       = 1;
  string            crop_cycle_id  = 2;
  ActivityCategory  category       = 3;
  int32             page_size      = 4;
  int32             page_offset    = 5;
}

message ListActivityEventsResponse {
  repeated ActivityEvent events      = 1;
  int32                  total_count = 2;
}

// -----------------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------------

service FieldService {
  // Field CRUD
  rpc CreateField       (CreateFieldRequest)       returns (CreateFieldResponse);
  rpc GetField          (GetFieldRequest)          returns (GetFieldResponse);
  rpc ListFields        (ListFieldsRequest)        returns (ListFieldsResponse);
  rpc UpdateField       (UpdateFieldRequest)       returns (UpdateFieldResponse);
  rpc DeleteField       (DeleteFieldRequest)       returns (DeleteFieldResponse);
  rpc SetFieldBoundary  (SetFieldBoundaryRequest)  returns (SetFieldBoundaryResponse);
  rpc AssignCrop        (AssignCropRequest)         returns (AssignCropResponse);
  rpc ListFieldsByFarm  (ListFieldsByFarmRequest)   returns (ListFieldsByFarmResponse);
  rpc SegmentField      (SegmentFieldRequest)       returns (SegmentFieldResponse);
  rpc GetFieldSegments  (GetFieldSegmentsRequest)   returns (GetFieldSegmentsResponse);
  rpc GetCropHistory    (GetCropHistoryRequest)     returns (GetCropHistoryResponse);

  // Crop Cycles
  rpc CreateCropCycle   (CreateCropCycleRequest)    returns (CreateCropCycleResponse);
  rpc GetCropCycle      (GetCropCycleRequest)       returns (GetCropCycleResponse);
  rpc ListCropCycles    (ListCropCyclesRequest)     returns (ListCropCyclesResponse);
  rpc UpdateCropCycle   (UpdateCropCycleRequest)    returns (UpdateCropCycleResponse);

  // Activity Events
  rpc LogActivityEvent  (LogActivityEventRequest)   returns (LogActivityEventResponse);
  rpc ListActivityEvents(ListActivityEventsRequest) returns (ListActivityEventsResponse);
}

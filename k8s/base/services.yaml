                secretKeyRef:
                  name: yieldpoint-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: YIELD_SERVICE_DATABASE_URL
            - name: KAFKA_BROKER
              value: "kafka.yieldpoint.svc.cluster.local:9092"
            - name: GRPC_PLAINTEXT
              value: "1"
            - name: PORT
              value: "8080"
            - name: S3_ENDPOINT
              value: "http://minio.yieldpoint.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "yieldpoint"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_REGION
              value: "us-east-1"
            - name: FIELD_SERVICE_URL
              value: "http://field-service:8080"
            - name: SOIL_SERVICE_URL
              value: "http://soil-service:8080"
            - name: IRRIGATION_SERVICE_URL
              value: "http://irrigation-service:8080"
            - name: PEST_PREDICTION_SERVICE_URL
              value: "http://pest-prediction-service:8080"
            - name: CROP_SERVICE_URL
              value: "http://crop-service:8080"
            - name: FARM_SERVICE_URL
              value: "http://farm-service:8080"
            - name: AI_GATEWAY_URL
              value: "ai-gateway:50051"
            - name: YIELD_REFRESH_TENANTS
              value: ""
            - name: YIELD_REFRESH_INTERVAL
              value: "168h"
            - name: WEATHER_SERVICE_URL
              value: "http://weather-service:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness gates traffic; liveness restarts a wedged process. They
          # point at different endpoints on purpose — /ready checks the
          # database, and a database blip must take the pod out of the load
          # balancer without restarting it into a crash loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Migrations run at startup, so first boot after a schema change
            # can take a while. Without this the liveness probe kills the pod
            # mid-migration and the next one starts the same migration again.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: yield-service
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: yield-service
    app.kubernetes.io/part-of: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: yield-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yield-service
  namespace: yieldpoint
spec:
  # One pod may go at a time during a node drain. Without a budget the cluster
  # autoscaler is free to evict both replicas of a two-replica service at once.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yield-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yield-service
  namespace: yieldpoint
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yield-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Five minutes before scaling down. A shorter window makes the autoscaler
      # chase a spiky load up and down, which costs more than the replicas it
      # removes.
      stabilizationWindowSeconds: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
  strategy:
    # See render_realtime(): two live pods split every room, so the old one goes
    # before the new one arrives.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
        app.kubernetes.io/part-of: yieldpoint
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Longer than the 30s shutdown in cmd/realtime/main.go. At the default of
      # 30s the kubelet's SIGKILL lands exactly as the server gives up on its
      # own deadline, so a drain would cut open WebSockets mid-frame every time.
      terminationGracePeriodSeconds: 45
      containers:
        - name: realtime
          image: ghcr.io/ppusapati/yieldpoint/realtime:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: yieldpoint-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yieldpoint-secrets
                  key: JWT_SECRET
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              # Memory is the dimension that matters: one entry per open
              # connection, per room member and per live inspection session.
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/part-of: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: realtime
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realtime
  namespace: yieldpoint
spec:
  # A single replica, so this cannot protect availability — it can only refuse
  # to let a node drain, for ever. It is written as "one may go" deliberately:
  # the transport is reconnectable and a stuck drain is worse than a reconnect.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
        app.kubernetes.io/part-of: yieldpoint
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          image: ghcr.io/ppusapati/yieldpoint/ai-gateway:latest
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: RUST_LOG
              value: "ai_gateway=info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            grpc:
              port: 50051
            # Model weights are loaded and warmed at startup, which takes far
            # longer than a Go service's boot.
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: yieldpoint
  labels: &svc-labels
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/ppusapati/yieldpoint/auth-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: yieldpoint-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: AUTH_SERVICE_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yieldpoint-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - port: 8080
      targetPort: 8080
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: ghcr.io/ppusapati/yieldpoint/ai-gateway:latest
          ports:
            - containerPort: 50051
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: ai-gateway
  ports:
    - port: 50051
      targetPort: 50051

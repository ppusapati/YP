apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: yieldpoint
    spec:
      # Spread across nodes. Three replicas on one node is one node away from
      # no gateway at all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/ppusapati/yieldpoint/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: yieldpoint-config
                  key: CORS_ORIGIN
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1

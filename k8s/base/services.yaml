  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: plant-diagnosis-service
    app.kubernetes.io/part-of: yieldpoint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plant-diagnosis-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One new pod at a time and never fewer than the current count: a
      # rolling deploy that is allowed to take a pod down first drops requests
      # on a two-replica service.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plant-diagnosis-service
        app.kubernetes.io/part-of: yieldpoint
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plant-diagnosis-service
          image: ghcr.io/ppusapati/yieldpoint/plant-diagnosis-service:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: yieldpoint-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yieldpoint-secrets
                  key: JWT_SECRET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: yieldpoint-secrets
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: yieldpoint-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: PLANT_DIAGNOSIS_SERVICE_DATABASE_URL
            - name: KAFKA_BROKER
              value: "kafka.yieldpoint.svc.cluster.local:9092"
            - name: GRPC_PLAINTEXT
              value: "1"
            - name: PORT
              value: "8080"
            - name: S3_ENDPOINT
              value: "http://minio.yieldpoint.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "yieldpoint"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_REGION
              value: "us-east-1"
            - name: FIELD_SERVICE_URL
              value: "http://field-service:8080"
            - name: FARM_SERVICE_URL
              value: "http://farm-service:8080"
            - name: AI_GATEWAY_URL
              value: "ai-gateway:50051"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Readiness gates traffic; liveness restarts a wedged process. They
          # point at different endpoints on purpose — /ready checks the
          # database, and a database blip must take the pod out of the load
          # balancer without restarting it into a crash loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Migrations run at startup, so first boot after a schema change
            # can take a while. Without this the liveness probe kills the pod
            # mid-migration and the next one starts the same migration again.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: plant-diagnosis-service
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: plant-diagnosis-service
    app.kubernetes.io/part-of: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: plant-diagnosis-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: plant-diagnosis-service
  namespace: yieldpoint
spec:
  # One pod may go at a time during a node drain. Without a budget the cluster
  # autoscaler is free to evict both replicas of a two-replica service at once.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plant-diagnosis-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: plant-diagnosis-service
  namespace: yieldpoint
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: plant-diagnosis-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Five minutes before scaling down. A shorter window makes the autoscaler
      # chase a spiky load up and down, which costs more than the replicas it
      # removes.
      stabilizationWindowSeconds: 300
---

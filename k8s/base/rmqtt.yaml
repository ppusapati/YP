apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmqtt
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: rmqtt
    app.kubernetes.io/part-of: yieldpoint
spec:
  # One replica, deliberately. Irrigation commands are request/reply over
  # topics: the service publishes to <controller>/cmd and waits for the panel
  # to answer on <controller>/ack. A second replica without shared session
  # state would land the reply on the broker the service is not listening to,
  # and a command that was taken would be recorded as unanswered.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rmqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rmqtt
    spec:
      containers:
        - name: rmqtt
          image: rmqtt/rmqtt:latest
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 8883
              name: mqtts
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: rmqtt
  namespace: yieldpoint
  labels:
    app.kubernetes.io/name: rmqtt
    app.kubernetes.io/part-of: yieldpoint
spec:
  selector:
    app.kubernetes.io/name: rmqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: mqtts
      port: 8883
      targetPort: 8883

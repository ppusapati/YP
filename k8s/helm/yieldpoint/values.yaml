##
## YieldPoint Helm Values
##

global:
  imageRegistry: ghcr.io/ppusapati/yieldpoint
  imageTag: latest
  imagePullPolicy: IfNotPresent
  namespace: yieldpoint

## ---------------------------------------------------------------------------
## Application services (HTTP on 8080)
## ---------------------------------------------------------------------------
services:
  auth:
    replicas: 2
    port: 8080
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    envSecret:
      - secretName: database-urls
        key: AUTH_SERVICE_DATABASE_URL
        envName: DATABASE_URL
      - secretName: yieldpoint-secrets
        key: JWT_SECRET
        envName: JWT_SECRET
    hpa:
      minReplicas: 2
      maxReplicas: 8
      cpuTarget: 70

  farm:
    replicas: 2
    port: 8080
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"

## ---------------------------------------------------------------------------
## AI Gateway (gRPC on 50051)
## ---------------------------------------------------------------------------
aiGateway:
  replicas: 2
  port: 50051
  protocol: grpc
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2"
  hpa:
    minReplicas: 2
    maxReplicas: 10
    cpuTarget: 60

## ---------------------------------------------------------------------------
## API Gateway
## ---------------------------------------------------------------------------
apiGateway:
  replicas: 2
  port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  hpa:
    minReplicas: 2
    maxReplicas: 10
    cpuTarget: 60

## ---------------------------------------------------------------------------
## Monolith (legacy, disabled by default)
## ---------------------------------------------------------------------------
monolith:
  enabled: false
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

## ---------------------------------------------------------------------------
## PostgreSQL
## ---------------------------------------------------------------------------
postgres:
  replicas: 1
  image: postgres:16-alpine
  user: yieldpoint
  database: yieldpoint
  storage: 20Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

## ---------------------------------------------------------------------------
## Kafka (KRaft mode)
## ---------------------------------------------------------------------------
kafka:
  replicas: 1
  image: confluentinc/cp-kafka:7.7.0
  storage: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

## ---------------------------------------------------------------------------
## Monitoring
## ---------------------------------------------------------------------------
monitoring:
  prometheus:
    enabled: true
    image: prom/prometheus:v2.53.0
    retention: 30d
    storage: 20Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1"
  grafana:
    enabled: true
    image: grafana/grafana:11.1.0
    storage: 5Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

## ---------------------------------------------------------------------------
## Ingress
## ---------------------------------------------------------------------------
ingress:
  enabled: true
  host: api.yieldpoint.io
  tls: true
  tlsSecretName: yieldpoint-tls
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  paths:
    - path: /auth
      service: auth-service
      port: 8080
    - path: /agriculture.farm.v1
      service: farm-service
      port: 8080
    - path: /agriculture.field.v1
      service: field-service
      port: 8080
    - path: /agriculture.crop.v1
      service: crop-service
      port: 8080
    - path: /agriculture.ai.v1
      service: ai-gateway
      port: 50051
    - path: /
      service: farm-service
      port: 8080

## ---------------------------------------------------------------------------
## Shared ConfigMap data
## ---------------------------------------------------------------------------
config:
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  LOG_LEVEL: "info"
  GRPC_PLAINTEXT: "false"

## ---------------------------------------------------------------------------
## Network policies
## ---------------------------------------------------------------------------
networkPolicy:
  enabled: true

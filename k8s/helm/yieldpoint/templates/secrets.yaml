apiVersion: v1
kind: Secret
metadata:
  name: yieldpoint-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "yieldpoint.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "" | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | default "" | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | default "" | quote }}
  EXTERNAL_API_KEY: {{ .Values.secrets.externalApiKey | default "" | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: database-urls
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "yieldpoint.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $svc := .Values.services }}
  {{- if $svc.envSecret }}
  {{- range $svc.envSecret }}
  {{- if eq .secretName "database-urls" }}
  {{ .key }}: {{ "" | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}

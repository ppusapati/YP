{{/*
  ClusterIP Service for each application service.
*/}}
{{- range $key, $svc := .Values.services }}
{{- $svcName := printf "%s-service" $key }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yieldpoint.serviceLabels" (dict "name" $svcName "context" $) | nindent 4 }}
spec:
  selector:
    {{- include "yieldpoint.selectorLabels" (dict "name" $svcName) | nindent 4 }}
  ports:
    - port: {{ $svc.port | default 8080 }}
      targetPort: {{ $svc.port | default 8080 }}
      protocol: TCP
{{- end }}


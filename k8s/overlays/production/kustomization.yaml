apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yieldpoint

resources:
  - ../../base
  # Primary plus a streaming replica, with a read-only `postgres-replica`
  # Service for the read-heavy services and a `postgres` Service that still
  # points at the primary so nothing has to change to keep writing.
  #
  # This is replication, not automatic failover: promoting the replica when the
  # primary dies still needs an operator, and infra/terraform/rds.tf is the
  # managed answer for a cloud deployment. Saying so beats a comment claiming
  # "failover readiness" over a manifest that has no election in it.
  - ../../postgres/replicated
  # advisory-service needs pgvector and the shared instance does not have it,
  # so it gets its own database. Not an alternative to the above — both.
  - ../../postgres/pgvector

# Three replicas for the things whose failure is felt immediately: the gateway
# every request enters through, the service that issues the tokens, and the one
# that answers "which farm is this". Everything else keeps the base's two and
# scales on its HPA.
replicas:
  - name: api-gateway
    count: 4
  - name: auth-service
    count: 3
  - name: farm-service
    count: 3
  - name: field-service
    count: 3
  - name: ai-gateway
    count: 3

patches:
  # Resource limits are NOT patched down across the board here.
  #
  # The previous version of this file replaced every Deployment's limits with
  # 512Mi/500m, listed *after* the ai-gateway patch that set 2Gi/4 CPU — and
  # kustomize applies patches in order, so the blanket one won. Production was
  # giving the model-serving gateway 512Mi and the explicit patch above it was
  # dead. The base now carries a per-service profile, and the only overrides
  # left here are the ones that genuinely differ in production.
  - target:
      kind: Deployment
      name: ai-gateway
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"

  # Spread every service across nodes, and keep it on the production pool.
  #
  # Anti-affinity is preferred rather than required: required would leave a
  # service unschedulable when the pool has fewer nodes than replicas, which is
  # exactly what happens during a node rotation — the moment spreading matters
  # least and availability matters most.
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-pool
                      operator: In
                      values:
                        - yieldpoint-production
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: yieldpoint
                  topologyKey: kubernetes.io/hostname

  - target:
      kind: Ingress
      name: yieldpoint-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.yieldpoint.io
      - op: replace
        path: /spec/rules/0/host
        value: api.yieldpoint.io

  - target:
      kind: ConfigMap
      name: yieldpoint-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: warn

  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"

labels:
  - pairs:
      environment: production
    includeSelectors: false

commonAnnotations:
  yieldpoint.io/environment: production

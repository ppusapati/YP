apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yieldpoint-staging

namePrefix: staging-

resources:
  - ../../base

# Override namespace for staging
patches:
  # --- Namespace ---
  - target:
      kind: Namespace
      name: yieldpoint
    patch: |
      - op: replace
        path: /metadata/name
        value: yieldpoint-staging

  # --- Fewer replicas for cost savings ---
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: farm-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: ai-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # --- Relaxed resource limits across all deployments ---
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m

  # --- Staging ingress host ---
  - target:
      kind: Ingress
      name: yieldpoint-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-api.yieldpoint.io
      - op: replace
        path: /spec/rules/0/host
        value: staging-api.yieldpoint.io

  # --- ConfigMap: staging log level ---
  - target:
      kind: ConfigMap
      name: yieldpoint-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: debug

commonLabels:
  environment: staging

commonAnnotations:
  yieldpoint.io/environment: staging
